name: Package Eiko MATLAB Release

on:
#  push:
#    tags:
#      - 'v*'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. LINUX MATLAB BUILD (CONTAINERIZED)
  # ==========================================
  build_matlab_linux:
    name: MATLAB Build (Linux, CUDA 12.8)
    if: true
    runs-on: ubuntu-22.04
    container:
      # Use the devel image so it includes nvcc and the compiler toolchain
      image: nvidia/cuda:12.8.2-devel-ubuntu20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Utilities for MATLAB Action
        # The NVIDIA base image is barebones. The setup-matlab action requires 
        # wget and unzip to fetch and extract the MATLAB runtime.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y wget unzip ca-certificates build-essential
          apt-get install -y gcc-10 g++-10

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: 'R2021a'
          products: >
            Parallel_Computing_Toolbox

      - name: Run MATLAB Setup Script
        uses: matlab-actions/run-command@v2
        env:
          # Inside the NVIDIA container, nvcc is reliably located here:
          MW_NVCC_PATH: /usr/local/cuda/bin/nvcc
          CUDA_HOME: /usr/local/cuda/
        with:
          command: addpath('matlab/eiko'); eiko_lib.setup('release');

      - name: Upload Linux MEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiko-linux-mex
          path: matlab/eiko/+eiko_lib/*.mexa64
          if-no-files-found: error

  # ==========================================
  # 2. WINDOWS MATLAB BUILD
  # ==========================================
  build_matlab_windows:
    name: MATLAB Build (Windows, CUDA 12.8)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.2'  # Forces the action to locate and activate the MSVC 2019 (v142) compiler

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust"]'
      
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: 'R2021a'
          products: >
            Parallel_Computing_Toolbox

      - name: Run MATLAB Setup Script
        uses: matlab-actions/run-command@v2
        env:
          MW_NVCC_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin\nvcc.exe
          CUDA_HOME: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        with:
          # Force MATLAB to lock in the C++ compiler before running your script
          command: >
            addpath('matlab/eiko'); 
            eiko_lib.setup('release');

      - name: Upload Windows MEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiko-windows-mex
          path: matlab/eiko/+eiko_lib/*.mexw64
          if-no-files-found: error

  # ==========================================
  # 3. COMBINE AND PACKAGE RELEASE
  # ==========================================
  package_matlab_release:
    name: Package Cross-Platform MATLAB Release
    needs: [build_matlab_linux, build_matlab_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Download MEX binaries to a TEMPORARY folder, NOT inside the eiko source tree
      - name: Download Linux MEX
        uses: actions/download-artifact@v4
        with:
          name: eiko-linux-mex
          path: temp_binaries/
          
      - name: Download Windows MEX
        uses: actions/download-artifact@v4
        with:
          name: eiko-windows-mex
          path: temp_binaries/

      - name: Generate MATLAB Registry
        run: |
          # Ensure target directory exists in the source tree
          mkdir -p matlab/eiko/+eiko_lib/
          
          python3 -c "
          import os, json, hashlib, glob
          repo, tag = '${{ github.repository }}', '${{ github.ref_name }}'
          registry = {'version': tag, 'binaries': []}
          
          # Scan the temporary folder to build the registry map
          for fpath in glob.glob('temp_binaries/*.mex*'):
              fname = os.path.basename(fpath)
              sha = hashlib.sha256(open(fpath, 'rb').read()).hexdigest()
              url = f'https://github.com/{repo}/releases/download/{tag}/{fname}'
              registry['binaries'].append({'file': fname, 'url': url, 'sha256': sha})
          
          json.dump(registry, open('matlab/eiko/+eiko_lib/registry.json', 'w'), indent=2)
          print(f'MATLAB registry generated with {len(registry[\"binaries\"])} binaries.')
          "

      - name: Create Pure Source Release Zip
        run: |
          # Copy the C++ source code into the MATLAB package structure
          # This ensures setup() has the files it needs to compile locally
          cp -r src matlab/eiko/+eiko_lib/

          cp temp_binaries/*_R2021a.mexw64 matlab/eiko/+eiko_lib/mex_bindings.mexw64
          cp temp_binaries/*_R2021a.mexa64 matlab/eiko/+eiko_lib/mex_bindings.mexa64
          
          # Zip the 'eiko' folder. It now contains source code and registry.json, but no binaries.
          cd matlab
          zip -r eiko_matlab_release.zip eiko/
          
      - name: Upload Final ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiko-matlab-release
          path: matlab/eiko_matlab_release.zip