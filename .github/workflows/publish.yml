name: Publish Base Wheel and Release Binaries

on:
  workflow_run:
    # This must match the exact "name:" defined at the very top of your build.yml file
    workflows: ["Package Eiko Multi-Language Release"] 
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The GitHub Actions Run ID to fetch artifacts from'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    runs-on: ubuntu-latest
    environment: pypi # <--- Links to your protected environment
    permissions:
      id-token: write # <--- Required for PyPI Trusted Publishing
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Tag Matches __init__.py Version
        run: |
          # Extract the version securely without importing the package
          INIT_VERSION=$(python3 -c "
          import re, sys
          try:
              content = open('python/eiko/__init__.py').read()
              match = re.search(r'^__version__\s*=\s*[\'\"”]([^\'\"”]+)[\'\"”]', content, re.MULTILINE)
              print(match.group(1)) if match else sys.exit(1)
          except Exception as e:
              print(f'Failed to read version: {e}')
              sys.exit(1)
          ")
          
          RAW_TAG="${{ github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          
          # Strip '-test' AND the run number attached to it (e.g., 0.8.5-test-42 -> 0.8.5)
          TAG_VERSION="${TAG_VERSION%-test*}"
          
          echo "Package version: $INIT_VERSION"
          echo "Git tag version: $TAG_VERSION"
          
          if [ "$INIT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! __init__.py says '$INIT_VERSION', but Git tag targets '$TAG_VERSION'"
            exit 1
          fi
          echo "Version match verified."
          
      - name: Locate and Download Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          
          if [ -z "$RUN_ID" ]; then
            echo "Searching for build workflow run for tag ${{ github.ref_name }}..."
            
            RUN_ID=$(gh run list \
              --workflow="build.yml" \
              --branch="${{ github.ref_name }}" \
              --status="success" \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Could not find a successful build run for this tag!"
            exit 1
          fi
          
          echo "Fetching artifacts from Run ID: $RUN_ID"
          echo "TARGET_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Registry
        run: |
          python3 -c "
          import os, json, hashlib, glob
          
          repo = '${{ github.repository }}'
          tag = '${{ github.ref_name }}'
          registry = {'version': tag, 'wheels': []}
          
          for filepath in glob.glob('artifacts/*.whl'):
              filename = os.path.basename(filepath)
              
              if 'any.whl' in filename:
                  continue
                  
              with open(filepath, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest()
                  
              url = f'https://github.com/{repo}/releases/download/{tag}/{filename}'
              
              registry['wheels'].append({
                  'file': filename,
                  'url': url,
                  'sha256': sha256
              })
              
          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2)
          "

      - name: Inject Registry into Base Wheel
        run: |
          python3 -m pip install --upgrade wheel
          
          # 1. Unpack the pure-Python base wheel
          wheel unpack artifacts/*-any.whl -d unpacked_wheel
          
          # 2. Find inner package folder (tracks python/eiko structure inside wheel)
          PACKAGE_DIR=$(find unpacked_wheel -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          
          # 3. Inject registry.json
          cp registry.json "$PACKAGE_DIR/"
          
          # 4. Repack the wheel 
          mkdir -p dist
          WHEEL_DIR=$(find unpacked_wheel -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$WHEEL_DIR" -d dist/

      - name: Upload Binaries and MEX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-test') }}

      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: "!contains(github.ref_name, '-test')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/          import os, json, hashlib, glob
          
          repo = '${{ github.repository }}'
          tag = '${{ github.ref_name }}'
          registry = {'version': tag, 'wheels': []}
          
          # Iterate over all downloaded wheels
          for filepath in glob.glob('artifacts/*.whl'):
              filename = os.path.basename(filepath)
              
              # Skip the pure-Python base wheel (we don't want it downloading itself)
              if 'any.whl' in filename:
                  continue
                  
              with open(filepath, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest()
                  
              url = f'https://github.com/{repo}/releases/download/{tag}/{filename}'
              
              # Add to registry (Your runtime script will parse the filename to find the right OS/Python match)
              registry['wheels'].append({
                  'file': filename,
                  'url': url,
                  'sha256': sha256
              })
              
          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2)
          "

      - name: Inject Registry into Base Wheel
        # Here we unpack the base wheel, inject the registry, and then pack it again. This is because a previous step (the main build and precompilation step) creates all wheels.
        # Such patching is a bit overkill, as we can actually just create the base wheel AFTER compiling the other wheels (it does not have to be built in parallel to those).
        run: |
          python -m pip install --upgrade wheel
          
          # 1. Unpack the pure-Python base wheel
          # Adjust the wildcard if your base wheel naming differs
          wheel unpack artifacts/*-any.whl -d unpacked_wheel
          
          # 2. Find the inner package directory (e.g., unpacked_wheel/eiko-1.0.0/eiko/)
          PACKAGE_DIR=$(find unpacked_wheel -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          
          # 3. Copy the registry into the package code
          cp registry.json "$PACKAGE_DIR/"
          
          # 4. Repack the wheel (this recalculates the RECORD hashes automatically)
          mkdir -p dist
          WHEEL_DIR=$(find unpacked_wheel -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$WHEEL_DIR" -d dist/

      - name: Upload Binaries and MEX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Mark as a pre-release if the tag contains '-test'
          prerelease: ${{ contains(github.ref_name, '-test') }}

      - name: Publish to TestPyPI
        if: contains(inputs.tag || github.ref_name, 'test')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # Ensure you have a Trusted Publisher configured for TestPyPI as well

      - name: Publish to PyPI
        if: "!contains(inputs.tag || github.ref_name, '-test')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          
      # Add your PyPI upload step here using the newly repacked wheel in dist/
      # e.g., pypa/gh-action-pypi-publish@release/v1
      # with:
      #   packages-dir: dist/
