name: Publish HTML
on:
  workflow_call: # Keeps it working with release.yml
  
  workflow_dispatch: # Makes it manually runnable via the GitHub UI
    inputs:
      run_id:
        description: 'The GitHub Actions Run ID of the build to fetch wheels from'
        required: true
        type: string

jobs:
  publish_gh_pages:
    name: Generate Siloed HTML Indexes and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # Required to download artifacts from other runs
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages-test
          path: public
        continue-on-error: true

      - name: Create fallback directory
        run: mkdir -p public

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: false
          # If triggered manually, use the provided run_id.
          # If triggered by the orchestrator, default to the current run context.
          run-id: ${{ inputs.run_id || github.run_id }}
          # A token is strictly required when downloading artifacts from a different run ID
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PEP-503 compliant Siloed Indexes
        run: |
          ls -R wheelhouse/
          shopt -s nullglob
          mkdir -p public/whl
          
          # 1. Sort NEW wheels
          for artifact_dir in wheelhouse/wheels-*; do
            dirname=$(basename "$artifact_dir")
            
            # Look for -cuXXX- or -cpu- in the middle of the artifact string
            # Example: wheels-ubuntu22.04-pt2.12.0-cu126-py3.10 matches "cu126"
            if [[ "$dirname" =~ -(cu[0-9]+|cpu)- ]]; then
              tag="${BASH_REMATCH[1]}"
              
              echo "Routing $dirname to $tag..."
              mkdir -p "public/whl/$tag/eiko"
              cp "$artifact_dir"/*.whl "public/whl/$tag/eiko/"
            else
              echo "Warning: Could not extract CUDA/CPU tag from $dirname"
            fi
          done

          # 2. Regenerate index files
          cd public/whl
          for dir in cu* cpu; do
            if [ -d "$dir" ]; then
              echo "<!DOCTYPE html><html><body><a href=\"eiko/\">eiko</a></body></html>" > "$dir/index.html"
              
              cd "$dir/eiko"
              echo "<!DOCTYPE html><html><head><title>Links for eiko ($dir)</title></head><body>" > index.html
              echo "<h1>Links for eiko</h1>" >> index.html
              
              for w in *.whl; do
                if [ "$w" != "index.html" ]; then
                  echo "<a href=\"$w\">$w</a><br>" >> index.html
                fi
              done
              
              echo "</body></html>" >> index.html
              cd ../..
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          publish_branch: gh-pages-test
