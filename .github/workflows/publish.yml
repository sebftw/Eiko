name: Publish Base Wheel and Release Binaries

on:
  workflow_run:
    workflows: ["Package Eiko Multi-Language Release"] 
    types: [completed]
  
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Manual Build Run ID'
        required: true
        type: string
      tag_name:
        description: 'Tag (e.g., v0.8.5-test-1)'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    if: ${{ (github.event.workflow_run.conclusion == 'success' && 
      startsWith(github.event.workflow_run.head_branch, 'v')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    
    steps:
      - name: Determine Target Tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            echo "TAG=$WF_BRANCH" >> $GITHUB_ENV
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "TAG=$INPUT_TAG" >> $GITHUB_ENV
          else
            echo "TAG=$REF_NAME" >> $GITHUB_ENV
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Locate Build Run ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$INPUT_RUN_ID"
          
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" == "workflow_run" ]; then
            RUN_ID="$WF_RUN_ID"
          fi
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "Searching for build for tag: ${{ env.TAG }}..."
            for i in {1..12}; do
              # Optional: Added --repo just to be extra safe
              RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow="release.yml" --branch="${{ env.TAG }}" --limit=1 --json databaseId --jq '.[0].databaseId')
              if [ ! -z "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then break; fi
              sleep 10
            done
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::Could not find build run!"
            exit 1
          fi
          
          echo "TARGET_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for Build Completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Optional: Added --repo just to be extra safe
        run: gh run watch ${{ env.TARGET_RUN_ID }} --repo ${{ github.repository }} --exit-status

      # ---------------------------------------------------------
      # ARTIFACT DOWNLOADS
      # ---------------------------------------------------------
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          # Only downloads artifacts matching these names/patterns.
          # The raw MEX artifacts will be ignored and won't clutter your release.
          pattern: '{*wheel*,eiko-matlab-release}'
          path: artifacts
          merge-multiple: false
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # REGISTRY INJECTION & RELEASE
      # ---------------------------------------------------------
      - name: Generate Registry, Rename Wheels, and Inject
        run: |
          python3 -c "
          import os, json, hashlib, glob, re, shutil
    
          repo = '${{ github.repository }}'
          raw_tag = '${{ env.TAG }}'
          version_key = raw_tag.lstrip('v')
    
          registry = {'versions': {version_key: []}}
          os.makedirs('staged_wheels', exist_ok=True)
    
          # recursive=True is critical to peek inside the downloaded artifact sub-folders
          for fpath in glob.glob('artifacts/**/*.whl', recursive=True):
              if 'any.whl' in fpath: 
                  continue
              
              # Grab the container folder name (e.g., 'wheels-ubuntu22.04-pt2.3.0-cu121-py3.10')
              parent_dir = os.path.basename(os.path.dirname(fpath))
              orig_fname = os.path.basename(fpath)
    
              # 1. Parse Python & OS from the actual wheel filename
              py_match = re.search(r'cp(\d)(\d{1,2})', orig_fname)
              py_ver = f'{py_match.group(1)}.{py_match.group(2)}' if py_match else 'unknown'
    
              os_name = 'unknown'
              if any(w in orig_fname.lower() for w in ['linux', 'manylinux', 'musllinux']):
                  os_name = 'linux'
              elif 'win' in orig_fname.lower():
                  os_name = 'windows'
              elif 'mac' in orig_fname.lower():
                  os_name = 'macos'
    
              # 2. Extract Frameworks & CUDA from the PARENT folder name
              cu_match = re.search(r'-(cu\d+)', parent_dir)
              cuda_ver = cu_match.group(1) if cu_match else ''
    
              pt_match = re.search(r'-(?:pt|torch)([\d\.]+)', parent_dir)
              torch_ver = pt_match.group(1).rstrip('.') if pt_match else ''
    
              jax_match = re.search(r'-jax([\d\.]+)', parent_dir)
              jax_ver = jax_match.group(1).rstrip('.') if jax_match else ''
    
              # 3. Assemble a guaranteed-unique, pip-legal PEP 427 wheel filename
              # Format: {distribution}-{version}(+{local_tag})-{python}-{abi}-{platform}.whl
              parts = orig_fname.split('-')
              dist = parts[0]
              base_ver = parts[1].split('+')[0] # strip any pre-existing local tags
              tail = '-'.join(parts[2:])
    
              local_tags = []
              if torch_ver: local_tags.append(f'torch{torch_ver}')
              if jax_ver:   local_tags.append(f'jax{jax_ver}')
              if cuda_ver:  local_tags.append(cuda_ver)
    
              local_str = '+' + '.'.join(local_tags) if local_tags else ''
              new_fname = f'{dist}-{base_ver}{local_str}-{tail}'
              new_fpath = os.path.join('staged_wheels', new_fname)
    
              # Move to staging with its new unique identity
              shutil.copy2(fpath, new_fpath)
              sha = hashlib.sha256(open(new_fpath, 'rb').read()).hexdigest()
    
              registry['versions'][version_key].append({
                  'filename': new_fname,
                  'os': os_name,
                  'python': py_ver,
                  'cuda': cuda_ver,
                  'torch': torch_ver,
                  'jax': jax_ver,
                  'url': f'https://github.com/{repo}/releases/download/{raw_tag}/{new_fname}',
                  'sha256': sha
              })
    
          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2)
          "
          python3 -m pip install --upgrade wheel
          
          # Unpack pure wheel, shove registry inside, repack
          wheel unpack artifacts/*-any.whl -d unpacked
          P_DIR=$(find unpacked -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          cp registry.json "$P_DIR/"
          
          mkdir -p dist
          W_DIR=$(find unpacked -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$W_DIR" -d dist/
    
          # Wipe the old, dangerously ambiguous artifacts directory and stage the renamed ones
          rm -rf artifacts/*
          cp staged_wheels/*.whl artifacts/
          cp dist/*-any.whl artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-test') }}
          generate_release_notes: true
          body: |
            ## 🚀 Installation

            ### 🐍 Python
            ```bash
            pip install eiko
            ```

            ***

            ### 🧮 MATLAB
            1. Scroll to the **Assets** section at the very bottom of these release notes.
            2. Download **`eiko_matlab.zip`** (do *not* use the generic "Source code" zips).
            3. Extract the folder to your local machine.
            4. Inside MATLAB, right-click the extracted folder and select **Add to Path &rarr; Selected Folders and Subfolders**.

            ***

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to TestPyPI
        if: ${{ contains(github.ref_name, '-test') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
