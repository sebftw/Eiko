name: Publish Base Wheel and Release Binaries
on:
  workflow_call:
    inputs:
      run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The GitHub Actions Run ID of the build to fetch artifacts from'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    runs-on: ubuntu-latest
    environment: pypi # <--- Links to your protected environment
    permissions:
      id-token: write # <--- Required for PyPI Trusted Publishing
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Required for the inline scripts and wheel CLI

      - name: Verify Tag, __init__.py, and CITATION.cff Versions Match
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          # Strip leading 'v'
          TAG_VERSION="${TAG_VERSION#v}"
          
          # Strip '-test' AND the run number attached to it
          TAG_VERSION="${TAG_VERSION%-test*}"
          
          python -c "
          import re, sys
          
          tag_version = '$TAG_VERSION'
          
          # 1. Read __init__.py
          try:
              init_content = open('python/eiko/__init__.py').read()
              init_match = re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', init_content, re.MULTILINE)
              init_version = init_match.group(1) if init_match else None
          except FileNotFoundError:
              print('::error::python/eiko/__init__.py not found!')
              sys.exit(1)
              
          # 2. Read CITATION.cff
          try:
              cff_content = open('CITATION.cff').read()
              # Matches 'version: 1.0.0' or 'version: \"1.0.0\"'
              cff_match = re.search(r'^version:\s*([^\s]+)', cff_content, re.MULTILINE)
              cff_version = cff_match.group(1).strip('\'\"') if cff_match else None
          except FileNotFoundError:
              print('::error::CITATION.cff not found!')
              sys.exit(1)
          
          print(f'Git tag version:     {tag_version}')
          print(f'__init__.py version: {init_version}')
          print(f'CITATION.cff version:{cff_version}')
          
          # 3. Validate
          if not init_version:
              print('::error::Could not parse __version__ from __init__.py')
              sys.exit(1)
          if not cff_version:
              print('::error::Could not parse version from CITATION.cff')
              sys.exit(1)
              
          if init_version != tag_version:
              print(f'::error::__init__.py ({init_version}) does not match tag ({tag_version})')
              sys.exit(1)
          if cff_version != tag_version:
              print(f'::error::CITATION.cff ({cff_version}) does not match tag ({tag_version})')
              sys.exit(1)
              
          print('All versions match perfectly.')
          "

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Use the explicitly passed run_id if available, otherwise fall back to current context
          run-id: ${{ inputs.run_id || github.event.inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Registry
        run: |
          python -c "
          import os, json, hashlib, glob
          
          repo = '${{ github.repository }}'
          tag = '${{ github.ref_name }}'
          registry = {'version': tag, 'wheels': []}
          
          # Iterate over all downloaded wheels
          for filepath in glob.glob('artifacts/*.whl'):
              filename = os.path.basename(filepath)
              
              # Skip the pure-Python base wheel (we don't want it downloading itself)
              if 'any.whl' in filename:
                  continue
                  
              with open(filepath, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest()
                  
              url = f'https://github.com/{repo}/releases/download/{tag}/{filename}'
              
              # Add to registry (Your runtime script will parse the filename to find the right OS/Python match)
              registry['wheels'].append({
                  'file': filename,
                  'url': url,
                  'sha256': sha256
              })
              
          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2)
          "

      - name: Inject Registry into Base Wheel
        # Here we unpack the base wheel, inject the registry, and then pack it again. This is because a previous step (the main build and precompilation step) creates all wheels.
        # Such patching is a bit overkill, as we can actually just create the base wheel AFTER compiling the other wheels (it does not have to be built in parallel to those).
        run: |
          python -m pip install --upgrade wheel
          
          # 1. Unpack the pure-Python base wheel
          # Adjust the wildcard if your base wheel naming differs
          wheel unpack artifacts/*-any.whl -d unpacked_wheel
          
          # 2. Find the inner package directory (e.g., unpacked_wheel/eiko-1.0.0/eiko/)
          PACKAGE_DIR=$(find unpacked_wheel -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          
          # 3. Copy the registry into the package code
          cp registry.json "$PACKAGE_DIR/"
          
          # 4. Repack the wheel (this recalculates the RECORD hashes automatically)
          mkdir -p dist
          WHEEL_DIR=$(find unpacked_wheel -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$WHEEL_DIR" -d dist/

      - name: Upload Binaries and MEX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          # Mark as a pre-release if the tag contains '-test'
          prerelease: ${{ contains(github.ref_name, '-test') }}

      - name: Publish to TestPyPI
        if: contains(github.ref, 'test')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # Ensure you have a Trusted Publisher configured for TestPyPI as well

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'test')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          
      # Add your PyPI upload step here using the newly repacked wheel in dist/
      # e.g., pypa/gh-action-pypi-publish@release/v1
      # with:
      #   packages-dir: dist/
