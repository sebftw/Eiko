name: Publish Base Wheel and Release Binaries

on:
  workflow_run:
    workflows: ["Package Eiko Multi-Language Release"] 
    types: [completed]
  
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Manual Build Run ID'
        required: true
        type: string
      tag_name:
        description: 'Tag (e.g., v0.8.5-test-1)'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    if: ${{ (github.event.workflow_run.conclusion == 'success' && 
      startsWith(github.event.workflow_run.head_branch, 'v')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    
    steps:
      - name: Determine Target Tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            echo "TAG=$WF_BRANCH" >> $GITHUB_ENV
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "TAG=$INPUT_TAG" >> $GITHUB_ENV
          else
            echo "TAG=$REF_NAME" >> $GITHUB_ENV
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Locate Build Run ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$INPUT_RUN_ID"
          
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" == "workflow_run" ]; then
            RUN_ID="$WF_RUN_ID"
          fi
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "Searching for build for tag: ${{ env.TAG }}..."
            for i in {1..12}; do
              # Optional: Added --repo just to be extra safe
              RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow="release.yml" --branch="${{ env.TAG }}" --limit=1 --json databaseId --jq '.[0].databaseId')
              if [ ! -z "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then break; fi
              sleep 10
            done
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::Could not find build run!"
            exit 1
          fi
          
          echo "TARGET_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for Build Completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Optional: Added --repo just to be extra safe
        run: gh run watch ${{ env.TARGET_RUN_ID }} --repo ${{ github.repository }} --exit-status

      # ---------------------------------------------------------
      # ARTIFACT DOWNLOADS
      # ---------------------------------------------------------
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          # Only downloads artifacts matching these names/patterns.
          # The raw MEX artifacts will be ignored and won't clutter your release.
          pattern: '{*wheel*,eiko-matlab-release}'
          path: artifacts
          merge-multiple: false
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # REGISTRY INJECTION & RELEASE
      # ---------------------------------------------------------
      - name: Generate Registry and Inject
        run: |
          python3 -c "
          import os, json, hashlib, glob, re
    
          repo = '${{ github.repository }}'
          raw_tag = '${{ env.TAG }}'
          version_key = raw_tag.lstrip('v').split('+')[0]
    
          registry = {'versions': {version_key: []}}
    
          for fpath in glob.glob('artifacts/**/*.whl', recursive=True):
              if 'any.whl' in fpath: 
                  continue
                  
              fname = os.path.basename(fpath)
              parent_dir = os.path.basename(os.path.dirname(fpath))
              sha = hashlib.sha256(open(fpath, 'rb').read()).hexdigest()
              
              # 1. OS & Python
              os_name = 'unknown'
              fname_low = fname.lower()
              if any(w in fname_low for w in ['linux', 'manylinux', 'musllinux']):
                  os_name = 'linux'
              elif 'win' in fname_low:
                  os_name = 'windows'
              elif 'mac' in fname_low:
                  os_name = 'macos'
    
              py_match = re.search(r'cp(\d)(\d{1,2})', fname)
              py_ver = f'{py_match.group(1)}.{py_match.group(2)}' if py_match else 'unknown'
    
              # 2. Extract metadata
              local_block_match = re.search(r'\+([^-]+)-', fname)
              local_block = local_block_match.group(1) if local_block_match else ''
    
              cuda_match = re.search(r'(cu\d+)', local_block, re.I)
              cuda_ver = cuda_match.group(1).lower() if cuda_match else ''
    
              pt_match = re.search(r'(?:pt|torch)([\d\.]+)', local_block, re.I)
              torch_ver = pt_match.group(1).rstrip('.') if pt_match else ''
    
              jax_match = re.search(r'jax([\d\.]*)', local_block, re.I)
              jax_ver = ''
              if jax_match:
                  jax_ver = jax_match.group(1).rstrip('.') or 'any'
    
              # Fallbacks
              if not cuda_ver:
                  p_cu = re.search(r'-(cu\d+)', parent_dir, re.I)
                  if p_cu: cuda_ver = p_cu.group(1).lower()
              if not torch_ver:
                  p_pt = re.search(r'-(?:pt|torch)([\d\.]+)', parent_dir, re.I)
                  if p_pt: torch_ver = p_pt.group(1).rstrip('.')
              if not jax_ver and 'jax' in parent_dir.lower():
                  p_jax = re.search(r'-jax([\d\.]*)', parent_dir, re.I)
                  jax_ver = (p_jax.group(1).rstrip('.') if p_jax else '') or 'any'
    
              registry['versions'][version_key].append({
                  'filename': fname,
                  'os': os_name,
                  'python': py_ver,
                  'cuda': cuda_ver,
                  'torch': torch_ver,
                  'jax': jax_ver,
                  'url': f'https://github.com/{repo}/releases/download/{raw_tag}/{fname}',
                  'sha256': sha
              })
    
          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2)
          "
          
          # Handle the MATLAB artifact
          if [ -d "artifacts/eiko-matlab-release" ]; then
            # Create a staging directory to assemble the final zip contents
            mkdir -p artifacts/eiko-matlab-release/staging
            
            # Check if the directory already contains a zip file
            EXISTING_ZIP=$(find artifacts/eiko-matlab-release -maxdepth 1 -name "*.zip" | head -n 1)
            
            if [ -n "$EXISTING_ZIP" ]; then
              # It's zipped: extract it into staging so we can modify it
              unzip -q "$EXISTING_ZIP" -d artifacts/eiko-matlab-release/staging/
              rm "$EXISTING_ZIP"
            else
              # It's an uncompressed folder: move its contents into staging
              mv artifacts/eiko-matlab-release/* artifacts/eiko-matlab-release/staging/ 2>/dev/null || true
            fi
            
            # 1. Inject the 'examples/matlab' folder as 'examples'
            # Using cp -a with '/.' ensures the contents are copied directly into the target directory
            mkdir -p artifacts/eiko-matlab-release/staging/examples
            cp -a examples/matlab/. artifacts/eiko-matlab-release/staging/examples/
            
            # 2. Inject the 'src' folder into 'eiko/+eiko_lib/src'
            mkdir -p artifacts/eiko-matlab-release/staging/eiko/+eiko_lib/src
            cp -a src/. artifacts/eiko-matlab-release/staging/eiko/+eiko_lib/src/
            
            # Zip the newly assembled folder structure
            cd artifacts/eiko-matlab-release/staging
            zip -rq ../../eiko_matlab.zip .
            
            # Return to the workspace root
            cd ../../..
            
            # Clean up the artifact folder
            rm -rf artifacts/eiko-matlab-release
          fi
          
          # Then flatten the directory
          mkdir -p flat_artifacts
          find artifacts/ -type f \( -name "*.whl" -o -name "*.zip" \) -exec cp {} flat_artifacts/ \;
          rm -rf artifacts/*
          
          # Pin Python script to raw files for the specific release tag
          sed -i "s|raw.githubusercontent.com/sebftw/Eiko/main|raw.githubusercontent.com/${{ github.repository }}/${{ env.TAG }}|g" python/install_eiko_python.bat

          # Pin MATLAB script to the full repository archive for the specific release tag
          sed -i "s|github.com/sebftw/Eiko/archive/refs/heads/main|github.com/${{ github.repository }}/archive/refs/tags/${{ env.TAG }}|g" matlab/install_eiko_matlab.bat
          
          cp python/install_eiko_python.bat flat_artifacts/
          cp matlab/install_eiko_matlab.bat flat_artifacts/
          cp flat_artifacts/* artifacts/
          
          # Now the wildcard will successfully find the pure-python wheel
          python3 -m pip install --upgrade wheel
          wheel unpack artifacts/*-any.whl -d unpacked
          
          # Inject registry and repack
          P_DIR=$(find unpacked -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          cp registry.json "$P_DIR/"
          
          mkdir -p dist
          W_DIR=$(find unpacked -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$W_DIR" -d dist/

          # Swap the old pure wheel for the injected one in artifacts
          rm artifacts/*-any.whl
          cp dist/*-any.whl artifacts/

      - name: Format Release Title
        run: |
          # Remove leading 'v' if present
          VER="${TAG#v}"
          
          # If the version does NOT contain a hyphen, it's a stable release.
          # Strip the trailing '.0' if it exists.
          if [[ "$VER" != *-* ]]; then
            VER="${VER%.0}"
          fi
          
          # Save to environment variables
          echo "RELEASE_TITLE=Eiko $VER" >> $GITHUB_ENV
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: artifacts/*
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-test') }}
          generate_release_notes: true
          body: |
            ## Installation Instructions

            ### 🐍 Python
            
            **Automated Installer (Recommended)**
            
            If you are new to Python, use the automated installer:
            * **Windows:** Download [`install_eiko_python.bat`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/install_eiko_python.bat) and double-click the file.
            * **Linux:** Download [`install_eiko_python.bat`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/install_eiko_python.bat), open a terminal, and run `bash install_eiko_python.bat`.

            💡 Tip: The installer will generate a `start_eiko` script. Run this script at any time to open a terminal with your Eiko environment activated and ready to go!
            
            **Manual Installation**
            
            To install Eiko manually, run
            ```bash
            pip install eiko
            ```
            It requires PyTorch or JAX as a backend, so also run one of the following lines:
            * **PyTorch:** `pip install torch torchvision --index-url https://download.pytorch.org/whl/cu130`
            * or **JAX:** `pip install jax[cuda13]`.
            
            We strongly recommend installing inside a virtual environment (e.g., `venv` or `conda`).
            
            ---
            
            ### 🧮 MATLAB

            **Manual Installation (Recommended)**
            1. Download [**`eiko_matlab.zip`**](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/eiko_matlab.zip) and extract the "eiko" folder.
            2. Inside MATLAB, right-click the "eiko" folder and select **Add to Path &rarr; Selected Folder(s)**.
            3. Eiko is now installed and ready for use.
            
            💡 **Tip:** To avoid doing this every time you launch MATLAB, you can add `addpath('/path/to/eiko')` to your `startup.m` file.
            
            **Automated Installer**
            
            To automatically configure your system for Eiko, use the installer:
            
            * **Windows:** Download [`install_eiko_matlab.bat`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/install_eiko_matlab.bat) and double-click the file.
            * **Linux:** Download [`install_eiko_matlab.bat`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/install_eiko_matlab.bat), open a terminal, and run `bash install_eiko_matlab.bat`.
            
            💡 Tip: The installer will generate a `start_eiko.m` script. You can run this script from MATLAB to activate Eiko!
            
            ***
            

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to TestPyPI
        if: ${{ contains(github.ref_name, '-test') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
