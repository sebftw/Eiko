name: Publish Base Wheel and Release Binaries

on:
  workflow_run:
    workflows: ["Package Eiko Multi-Language Release"] 
    types: [completed]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Manual Build Run ID'
        required: true
        type: string
      tag_name:
        description: 'Tag (e.g., v0.8.5-test-1)'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    # FIX: Added 'push' so it doesn't skip during your branch testing
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    
    steps:
      - name: Determine Target Tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "TAG=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Locate Build Run ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" == "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "Searching for build for tag: ${{ env.TAG }}..."
            # Try to find the run for 2 minutes
            for i in {1..12}; do
              # Note: --workflow must match the filename 'build.yml' or the 'name:' in build.yml
              RUN_ID=$(gh run list --workflow="release.yml" --branch="${{ env.TAG }}" --limit=1 --json databaseId --jq '.[0].databaseId')
              if [ ! -z "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then break; fi
              sleep 10
            done
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::Could not find build run!"
            exit 1
          fi
          echo "TARGET_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for Build Completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch ${{ env.TARGET_RUN_ID }} --exit-status

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Registry and Inject
        run: |
          python3 -c "
          import os, json, hashlib, glob
          repo, tag = '${{ github.repository }}', '${{ env.TAG }}'
          registry = {'version': tag, 'wheels': []}
          for fpath in glob.glob('artifacts/*.whl'):
              if 'any.whl' in fpath: continue
              fname = os.path.basename(fpath)
              sha = hashlib.sha256(open(fpath, 'rb').read()).hexdigest()
              registry['wheels'].append({'file': fname, 'url': f'https://github.com/{repo}/releases/download/{tag}/{fname}', 'sha256': sha})
          json.dump(registry, open('registry.json', 'w'), indent=2)
          "
          python3 -m pip install --upgrade wheel
          wheel unpack artifacts/*-any.whl -d unpacked
          P_DIR=$(find unpacked -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          cp registry.json "$P_DIR/"
          mkdir -p dist
          wheel pack $(find unpacked -mindepth 1 -maxdepth 1 -type d) -d dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-test') }}

      - name: Publish to PyPI/TestPyPI
        env:
          TWINE_USERNAME: __token__
          # You can use the official gh-action-pypi-publish here as well
        run: |
          if [[ "${{ env.TAG }}" == *"-test"* ]]; then
            echo "Publishing to TestPyPI..."
          else
            echo "Publishing to PyPI..."
          fi
