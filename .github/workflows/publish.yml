name: Publish Base Wheel and Release Binaries

on:
  workflow_run:
    workflows: ["Package Eiko Multi-Language Release"] 
    types: [completed]
  
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Manual Build Run ID'
        required: true
        type: string
      tag_name:
        description: 'Tag (e.g., v0.8.5-test-1)'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Determine Target Tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            echo "TAG=$WF_BRANCH" >> $GITHUB_ENV
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "TAG=$INPUT_TAG" >> $GITHUB_ENV
          else
            echo "TAG=$REF_NAME" >> $GITHUB_ENV
          fi

      - name: Locate Build Run ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$INPUT_RUN_ID"
          
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" == "workflow_run" ]; then
            RUN_ID="$WF_RUN_ID"
          fi
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "Searching for build for tag: ${{ env.TAG }}..."
            for i in {1..12}; do
              # Optional: Added --repo just to be extra safe
              RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow="release.yml" --branch="${{ env.TAG }}" --limit=1 --json databaseId --jq '.[0].databaseId')
              if [ ! -z "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then break; fi
              sleep 10
            done
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::Could not find build run!"
            exit 1
          fi
          
          echo "TARGET_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for Build Completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Optional: Added --repo just to be extra safe
        run: gh run watch ${{ env.TARGET_RUN_ID }} --repo ${{ github.repository }} --exit-status

      # ---------------------------------------------------------
      # ARTIFACT DOWNLOADS
      # ---------------------------------------------------------
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MATLAB Source Zip
        uses: actions/download-artifact@v4
        # continue-on-error prevents the workflow from failing if a specific release doesn't include MATLAB updates
        continue-on-error: true
        with:
          name: eiko-matlab-release
          path: artifacts
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Linux MEX Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eiko-linux-mex
          path: artifacts
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download Windows MEX Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eiko-windows-mex
          path: artifacts
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # REGISTRY INJECTION & RELEASE
      # ---------------------------------------------------------
      - name: Generate Registry and Inject
        run: |
          python3 -c "
          import os, json, hashlib, glob
          repo, tag = '${{ github.repository }}', '${{ env.TAG }}'
          registry = {'version': tag, 'wheels': []}
          for fpath in glob.glob('artifacts/*.whl'):
              if 'any.whl' in fpath: continue
              fname = os.path.basename(fpath)
              sha = hashlib.sha256(open(fpath, 'rb').read()).hexdigest()
              registry['wheels'].append({'file': fname, 'url': f'https://github.com/{repo}/releases/download/{tag}/{fname}', 'sha256': sha})
          json.dump(registry, open('registry.json', 'w'), indent=2)
          "
          python3 -m pip install --upgrade wheel
          
          # Unpack the pure-python wheel
          wheel unpack artifacts/*-any.whl -d unpacked
          
          # Find internal package directory and copy registry inside
          P_DIR=$(find unpacked -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          cp registry.json "$P_DIR/"
          
          # Find top-level unpacked directory and pack it to dist/
          mkdir -p dist
          W_DIR=$(find unpacked -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$W_DIR" -d dist/

          # Replace the old pure wheel in artifacts with the newly injected one
          # This ensures your GitHub Release step uploads the correct asset.
          rm artifacts/*-any.whl
          cp dist/*-any.whl artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-test') }}

      - name: Publish to PyPI/TestPyPI
        env:
          TWINE_USERNAME: __token__
          # You can use the official gh-action-pypi-publish here as well
        run: |
          if [[ "${{ env.TAG }}" == *"-test"* ]]; then
            echo "Publishing to TestPyPI..."
          else
            echo "Publishing to PyPI..."
          fi
