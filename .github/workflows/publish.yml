name: Publish Base Wheel and Release Binaries

on:
  workflow_run:
    # This must match the exact "name:" defined at the very top of your build.yml file
    workflows: ["Package Eiko Multi-Language Release"] 
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The GitHub Actions Run ID to fetch artifacts from'
        required: true
        type: string
      tag_name:
        description: 'The exact tag to release (e.g., v0.8.5-test-42)'
        required: true
        type: string

jobs:
  build_and_release:
    name: Inject Registry and Publish Release
    # CRITICAL: Only proceed if the triggering build succeeded, or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    
    steps:
      - name: Determine Target Tag and Run ID
        # Maps variables dynamically depending on how the workflow was triggered
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "TAG=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
            echo "TARGET_RUN_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
            echo "TARGET_RUN_ID=${{ github.event.inputs.run_id }}" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # CRITICAL: Forces checking out the specific tag instead of the default branch
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Tag Matches __init__.py Version
        run: |
          INIT_VERSION=$(python3 -c "
          import re, sys
          try:
              content = open('python/eiko/__init__.py').read()
              match = re.search(r'^__version__\s*=\s*[\'\"”]([^\'\"”]+)[\'\"”]', content, re.MULTILINE)
              print(match.group(1)) if match else sys.exit(1)
          except Exception as e:
              print(f'Failed to read version: {e}')
              sys.exit(1)
          ")
          
          RAW_TAG="${{ env.TAG }}"
          TAG_VERSION="${RAW_TAG#v}"
          TAG_VERSION="${TAG_VERSION%-test*}"
          
          echo "Package version: $INIT_VERSION"
          echo "Git tag version: $TAG_VERSION"
          
          if [ "$INIT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! __init__.py says '$INIT_VERSION', but Git tag targets '$TAG_VERSION'"
            exit 1
          fi
          echo "Version match verified."
          
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Registry
        run: |
          python3 -c "
          import os, json, hashlib, glob
          
          repo = '${{ github.repository }}'
          tag = '${{ env.TAG }}'
          registry = {'version': tag, 'wheels': []}
          
          for filepath in glob.glob('artifacts/*.whl'):
              filename = os.path.basename(filepath)
              
              if 'any.whl' in filename:
                  continue
                  
              with open(filepath, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest()
                  
              url = f'https://github.com/{repo}/releases/download/{tag}/{filename}'
              
              registry['wheels'].append({
                  'file': filename,
                  'url': url,
                  'sha256': sha256
              })
              
          with open('registry.json', 'w') as f:
              json.dump(registry, f, indent=2)
          "

      - name: Inject Registry into Base Wheel
        run: |
          python3 -m pip install --upgrade wheel
          
          wheel unpack artifacts/*-any.whl -d unpacked_wheel
          PACKAGE_DIR=$(find unpacked_wheel -mindepth 2 -maxdepth 2 -type d -not -name "*.dist-info")
          cp registry.json "$PACKAGE_DIR/"
          
          mkdir -p dist
          WHEEL_DIR=$(find unpacked_wheel -mindepth 1 -maxdepth 1 -type d)
          wheel pack "$WHEEL_DIR" -d dist/

      - name: Upload Binaries and MEX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-test') }}

      - name: Publish to TestPyPI
        if: contains(env.TAG, '-test')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: "!contains(env.TAG, '-test')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
