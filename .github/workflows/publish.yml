name: Publish Base Wheel and Release Binaries
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The GitHub Actions Run ID of the build to fetch wheels from'
        required: true
        type: string

jobs:
  build_and_release:
    name: Build Base Wheel, Generate Registry, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Registry and Checksums
        run: |
          # Ensure target directory exists
          mkdir -p python/eiko
          
          echo "{" > python/eiko/registry.json
          echo '  "version": "${{ github.ref_name }}",' >> python/eiko/registry.json
          echo '  "wheels": {' >> python/eiko/registry.json
          
          FIRST=true
          shopt -s nullglob
          for wheel in wheelhouse/*.whl; do
            filename=$(basename "$wheel")
            
            if [[ "$filename" =~ (cu(da)?[-_]?[0-9.]+|cpu) ]]; then
              tag="${BASH_REMATCH[1]}"
              tag=$(echo "$tag" | sed 's/da//; s/[-_\.]//g')
              
              hash=$(sha256sum "$wheel" | awk '{print $1}')
              url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$filename"
              
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                echo "," >> python/eiko/registry.json
              fi
              
              echo "    \"$tag\": {\"url\": \"$url\", \"sha256\": \"$hash\"}" >> python/eiko/registry.json
            fi
          done
          
          echo "  }" >> python/eiko/registry.json
          echo "}" >> python/eiko/registry.json

      - name: Build Pure-Python Base Wheel
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel .

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          tag_name: ${{ github.ref_name }}
          # Uncomment below if you want the action to create the release automatically
          # name: Release ${{ github.ref_name }}
          # draft: false
          # prerelease: false
          
      # Add your PyPI upload step here using the built files in dist/
      # e.g., pypa/gh-action-pypi-publish@release/v1
