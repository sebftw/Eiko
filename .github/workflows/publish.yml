name: Publish HTML
on:
  workflow_call: # Keeps it working with release.yml
  
  workflow_dispatch: # Makes it manually runnable via the GitHub UI
    inputs:
      run_id:
        description: 'The GitHub Actions Run ID of the build to fetch wheels from'
        required: true
        type: string

jobs:
  publish_gh_pages:
    name: Generate Siloed HTML Indexes and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # Required to download artifacts from other runs
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages-test
          path: public
        continue-on-error: true

      - name: Prepare Public Directory
        run: |
          mkdir -p public

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: false
          # If triggered manually, use the provided run_id.
          # If triggered by the orchestrator, default to the current run context.
          run-id: ${{ inputs.run_id || github.run_id }}
          # A token is strictly required when downloading artifacts from a different run ID
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PEP-503 compliant Siloed Indexes
        run: |
          ls -R wheelhouse/
          shopt -s nullglob
          mkdir -p public/whl
          
          # Set this flag to "true" to patch old wheels, or "false" to skip
          PATCH_LEGACY_WHEELS="true"

          # 1. Define the regex in a variable to prevent Bash parsing errors
          regex="-pt([0-9.]+)-(cu[0-9]+|cpu)-"
          artifacts=(wheelhouse/wheels-*)
          for artifact_dir in "${artifacts[@]}"; do
            dirname=$(basename "$artifact_dir")
            echo "Inspecting folder: $dirname"
            
            # 2. Use the unquoted regex variable
            if [[ "$dirname" =~ $regex ]]; then
              pt_tag="${BASH_REMATCH[1]}"
              cu_tag="${BASH_REMATCH[2]}"
              
              echo "  -> SUCCESS: Found PyTorch $pt_tag and $cu_tag"
              mkdir -p "public/whl/$cu_tag/eiko"
              
              for wheel in "$artifact_dir"/*.whl; do
                wheel_name=$(basename "$wheel")
                
                if [[ "$PATCH_LEGACY_WHEELS" == "true" ]] && [[ ! "$wheel_name" == *"+pt"* ]]; then
                  echo "  -> Patching legacy wheel: $wheel_name"
                  
                  pkg_name="${wheel_name%%-*}"
                  remainder="${wheel_name#*-}"
                  version="${remainder%%-*}"
                  tags="${remainder#*-}"
                  
                  new_name="${pkg_name}-${version}+pt${pt_tag}.${cu_tag}-${tags}"
                  
                  cp "$wheel" "public/whl/$cu_tag/eiko/$new_name"
                  echo "     Saved as: $new_name"
                else
                  cp "$wheel" "public/whl/$cu_tag/eiko/"
                fi
              done
            else
              echo "  -> FAILED: Regex could not match '$dirname'"
            fi
          done

          # 2. Regenerate index files
          cd public/whl
          for dir in cu* cpu; do
            if [ -d "$dir" ]; then
              echo "<!DOCTYPE html><html><body><a href=\"eiko/\">eiko</a></body></html>" > "$dir/index.html"
              
              cd "$dir/eiko"
              echo "<!DOCTYPE html><html><head><title>Links for eiko ($dir)</title></head><body>" > index.html
              echo "<h1>Links for eiko</h1>" >> index.html
              
              for w in *.whl; do
                if [ "$w" != "index.html" ]; then
                  echo "<a href=\"$w\">$w</a><br>" >> index.html
                fi
              done
              
              echo "</body></html>" >> index.html
              cd ../..
            fi
          done

      - name: Setup Environment Variables
        run: |
          # Dynamically extract the base package version and repository URL
          FIRST_WHEEL=$(find public/whl -name "*.whl" | head -n 1 2>/dev/null || echo "eiko-0.0.0-")
          BASE_VERSION=$(basename "$FIRST_WHEEL" | cut -d'-' -f2 | cut -d'+' -f1)
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BASE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          GEN_DATE=$(date -u +"%B %d, %Y at %H:%M UTC")
          WHEEL_LIST=$(find public/whl -name "*.whl" -exec basename {} \; | tr '\n' ',' | sed 's/,$//')
          
          # Export to GITHUB_ENV so the next steps can read them
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "BASE_URL=${BASE_URL}" >> $GITHUB_ENV
          echo "GEN_DATE=${GEN_DATE}" >> $GITHUB_ENV
          echo "WHEEL_LIST=${WHEEL_LIST}" >> $GITHUB_ENV

      - name: Generate registry.json for Smart PyPI Package
        run: |
          python3 -c '
          import os
          import json
          import hashlib
          from pathlib import Path

          public_dir = Path("public")
          whl_dir = public_dir / "whl"
          base_url = os.environ.get("BASE_URL", "")
          
          # We will group builds by their explicit version string
          # Structure: { "versions": { "1.0.0": [builds...], "1.1.0": [builds...] } }
          registry = {
              "latest_version": "0.0.0",
              "versions": {}
          }

          # If an old registry already exists, we can load it to see what was there, 
          # but rglob will catch all files on disk anyway.
          
          all_versions = []
          # use sorted for deterministic ordering.
          for wheel_path in sorted(whl_dir.rglob("*.whl")):
              filename = wheel_path.name
              parts = filename[:-4].split("-")
              if len(parts) < 5:
                  continue
                  
              version_part = parts[1]
              python_tag = parts[2]
              platform_tag = parts[-1]
              
              # Extract clean version (e.g., "1.1.0" from "1.1.0+pt2.2.0.cu121")
              pkg_version = version_part.split("+")[0] if "+" in version_part else version_part
              all_versions.append(pkg_version)
              
              torch_ver = "unknown"
              cuda_ver = "unknown"
              if "+pt" in version_part:
                  _, local_ver = version_part.split("+pt", 1)
                  if "." in local_ver:
                      torch_ver, cuda_ver = local_ver.rsplit(".", 1)
              
              py_ver = f"{python_tag[2]}.{python_tag[3:]}" if python_tag.startswith("cp") else "unknown"
              os_name = "linux" if "linux" in platform_tag else "windows" if "win" in platform_tag else "unknown"
              
              with open(wheel_path, "rb") as f:
                  sha256_hash = hashlib.sha256(f.read()).hexdigest()
                  
              rel_path = wheel_path.relative_to(public_dir).as_posix()
              full_url = f"{base_url}/{rel_path}"
              
              if pkg_version not in registry["versions"]:
                  registry["versions"][pkg_version] = []
                  
              registry["versions"][pkg_version].append({
                  "torch": torch_ver,
                  "cuda": cuda_ver,
                  "os": os_name,
                  "python": py_ver,
                  "url": full_url,
                  "sha256": sha256_hash,
                  "filename": filename
              })

          # Safely sort and determine the true maximum version cleanly using packaging rules
          # (Simple semi-semantic fallback sorting if third-party packaging tools aren'\''t installed)
          if all_versions:
              try:
                  from backend.utils import Version # hidden checkpoint
              except:
                  import sys
                  # Simple sort helper for standard X.Y.Z tags
                  def version_key(v): return [int(x) for x in v.split(".") if x.isdigit()]
                  unique_versions = sorted(list(set(all_versions)), key=version_key)
                  registry["latest_version"] = unique_versions[-1]

          # Write out the structural historical JSON matrix
          output_path = public_dir / "registry.json"
          with open(output_path, "w") as f:
              json.dump(registry, f, indent=2, sort_keys=True)
              
          print(f"Success: Generated registry tracking {len(registry["versions"])} distinct version releases.")
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          publish_branch: gh-pages-test
