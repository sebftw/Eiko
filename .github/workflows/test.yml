name: Python Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'       # Triggers on any changes to C++ code
      - 'python/**'    # Triggers on any changes to Python code
      
      # CRITICAL: You must also whitelist your configuration files!
      # If you don't, changing your test setup won't trigger the tests to run.
      - 'tox.ini'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/tests.yml' # The filename of this exact workflow
      
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'python/**'
      - 'tox.ini'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/test.yml'

  workflow_dispatch:

# Automatically cancel in-progress runs if a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Target your self-hosted hardware for native JIT compilation and execution
    runs-on: [self-hosted, linux, gpu]
    strategy:
      fail-fast: false 
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Run Tox (JIT Compile & Execute)
      # Tox will pass your system's CUDA_HOME and PATH into its isolated environments, 
      # allowing pybind11/setuptools to compile the C++/.cu extensions from source.
      run: tox

    - name: Rename coverage file
      run: mv .coverage .coverage.${{ matrix.python-version }}

    - name: Upload coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-${{ matrix.python-version }}
        path: .coverage.${{ matrix.python-version }}
        include-hidden-files: true

  coverage:
    name: Combine Coverage
    needs: test # Waits for all GPU matrix jobs to finish
    # Offload the lightweight combination task to GitHub's free runners
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Download all coverage data
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-data-*
        merge-multiple: true

    - name: Run coverage combination and report
      run: tox -e coverage
