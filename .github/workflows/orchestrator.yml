name: "🚀 Trigger Production Release"

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      is_test:
        description: 'Test Run (Creates a temporary tag and uploads to TestPyPI)'
        required: true
        type: boolean
        default: false

jobs:
  bump_and_tag:
    name: 1. Bump Version and Push Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Standard GITHUB_TOKEN won't trigger subsequent workflows when pushing commits.
          # Use a Personal Access Token (PAT) if your repository settings require it to trigger actions,
          # or ensure your branch protections allow the default token to push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bump Tool
        run: pip install bump-my-version

      - name: Configure Git Author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Extract New Version Tag
        id: get_tag
        run: |
          # Extract the version with strict error checking
          VERSION=$(python -c "
          import re, sys
          try:
              content = open('python/eiko/__init__.py').read()
              match = re.search(r'^__version__\s*=\s*[\'\"”]([^\'\"”]+)[\'\"”]', content, re.MULTILINE)
              if match:
                  print(match.group(1))
              else:
                  print('::error::Regex failed to match in __init__.py', file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f'::error::Failed to read file: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          
          # Failsafe: Abort if VERSION is somehow still empty
          if [ -z "$VERSION" ]; then
            echo "::error::Extracted version string is empty! Aborting."
            exit 1
          fi
          
          echo "Successfully extracted version: $VERSION"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          
          # Create and push the local tag
          git tag "v$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$VERSION"

      - name: Bump Version and Generate Tag
        id: version_logic
        run: |
          # Configure Git Author immediately so commits/tags work
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then
            echo "======================================================="
            echo "🚀 RUNNING A TEST RELEASE (TestPyPI Sandbox)"
            echo "======================================================="
            
            # 1. Read current version from __init__.py without bumping
            VERSION=$(python3 -c "
            import re, os, sys
            path = 'python/eiko/__init__.py'
            if not os.path.exists(path):
                print(f'::error::Could not find {path}', file=sys.stderr)
                sys.exit(1)
            with open(path, 'r') as f:
                match = re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f.read(), re.M)
                if match:
                    print(match.group(1))
                else:
                    print('::error::Could not find __version__ string', file=sys.stderr)
                    sys.exit(1)
            ")

            if [ -z "$VERSION" ]; then
              echo "::error::Failed to parse version for test run."
              exit 1
            fi

            # 2. Append the run number to ensure tag uniqueness (e.g., v0.8.5-test-14)
            TAG="v${VERSION}-test-${{ github.run_number }}"
            echo "Test Tag Created: $TAG"
            
            # 3. Tag and push locally to the test branch environment
            git tag "$TAG"
            git push origin "$TAG"
            
            echo "tag=$TAG" >> $GITHUB_OUTPUT

          else
            echo "======================================================="
            echo "📦 RUNNING A PRODUCTION RELEASE (PyPI)"
            echo "======================================================="
            
            # 1. Execute the tool to bump code and auto-commit changes to python/eiko/__init__.py
            bump-my-version bump ${{ github.event.inputs.bump_type }}
            
            # 2. Read the newly bumped version from __init__.py
            VERSION=$(python3 -c "
            import re, os, sys
            path = 'python/eiko/__init__.py'
            if not os.path.exists(path):
                print(f'::error::Could not find {path}', file=sys.stderr)
                sys.exit(1)
            with open(path, 'r') as f:
                match = re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f.read(), re.M)
                if match:
                    print(match.group(1))
                else:
                    print('::error::Could not find newly bumped __version__', file=sys.stderr)
                    sys.exit(1)
            ")

            if [ -z "$VERSION" ]; then
              echo "::error::Failed to parse version after production bump."
              exit 1
            fi

            TAG="v${VERSION}"
            echo "Production Tag Created: $TAG"
            
            # 3. Create the production tag, push the bump commit to the working branch, and push the tag
            git tag "$TAG"
            git push origin HEAD:${{ github.ref_name }}
            git push origin "$TAG"
            
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Push Changes and Tag
        run: |
          # Push the version bump commit back to your default branch
          git push origin HEAD:${{ github.ref_name }}
          # Push the newly minted release tag
          git push origin "v${{ steps.get_tag.outputs.tag }}"

  run_build:
    name: 2. Compile Binaries
    needs: bump_and_tag
    # Points directly to your existing build workflow file
    uses: ./.github/workflows/release.yml
    with:
      # CRITICAL: Force the build runner to execute on the new tag,
      # ensuring the wheels pick up the newly bumped __version__
      ref: ${{ needs.bump_and_tag.outputs.new_tag }}

  run_publish:
    name: 3. Inject Registry & Publish
    needs: [bump_and_tag, run_build]
    uses: ./.github/workflows/publish.yml
    # EXPLICITLY GRANT PERMISSIONS TO THE CHILD WORKFLOW
    permissions:
      contents: write
      actions: read
      id-token: write
    secrets: inherit # Automatically passes PyPI credentials/tokens downstream
