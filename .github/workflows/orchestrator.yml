name: "🚀 Trigger Production Release"

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      is_test:
        description: 'Test Run (Creates a temporary tag and uploads to TestPyPI)'
        required: true
        type: boolean
        default: false

jobs:
  bump_and_tag:
    name: 1. Bump Version and Push Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version_logic.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Standard GITHUB_TOKEN won't trigger subsequent workflows when pushing commits.
          # Use a Personal Access Token (PAT) if your repository settings require it to trigger actions,
          # or ensure your branch protections allow the default token to push.
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Bump Tool
        run: pip install bump-my-version

      - name: Bump Version and Generate Tag
        id: version_logic
        run: |
          # Configure Git Author
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Bash function to extract version cleanly without Python indentation issues
          extract_version() {
            if [ ! -f "python/eiko/__init__.py" ]; then
              echo "::error::Could not find python/eiko/__init__.py"
              exit 1
            fi
            
            local v
            # Uses sed to capture the version string between single or double quotes
            v=$(sed -n "s/^__version__[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" python/eiko/__init__.py)
            
            if [ -z "$v" ]; then
              echo "::error::Failed to parse version from __init__.py"
              exit 1
            fi
            echo "$v"
          }

          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then
            echo "======================================================="
            echo "🚀 RUNNING A TEST RELEASE (TestPyPI Sandbox)"
            echo "======================================================="
            
            # Extract current version
            VERSION=$(extract_version)
            
            TAG="v${VERSION}-test-${{ github.run_number }}"
            echo "Test Tag Created: $TAG"
            
            git tag "$TAG"
            # 1. Push the branch code first so GitHub updates its workflow registry
            git push origin HEAD:${{ github.ref_name }}
            # 2. Push the tag second so the trigger finds the updated file
            git push origin "$TAG"            
            echo "tag=$TAG" >> $GITHUB_OUTPUT

          else
            echo "======================================================="
            echo "📦 RUNNING A PRODUCTION RELEASE (PyPI)"
            echo "======================================================="
            
            # Bump the code
            bump-my-version bump ${{ github.event.inputs.bump_type }}
            
            # Extract the newly bumped version
            VERSION=$(extract_version)
            
            TAG="v${VERSION}"
            echo "Production Tag Created: $TAG"
            
            git tag "$TAG"
            # 1. Push the branch code first so GitHub updates its workflow registry
            git push origin HEAD:${{ github.ref_name }}
            # 2. Push the tag second so the trigger finds the updated file
            git push origin "$TAG"            
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            
          fi
