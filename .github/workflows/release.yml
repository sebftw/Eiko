name: Package Eiko Multi-Language Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_ubuntu_wheels:
    name: Ubuntu (Torch:${{ matrix.config.torch }}, CUDA:${{ matrix.config.cuda }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # PyTorch 2.5 supports older CUDA 12.x
          # - { torch: '2.5.0', cuda: '12.1.1' }
          # - { torch: '2.5.0', cuda: '12.4.0' }
          
          # PyTorch 2.9 dropped 12.4, moved to 12.6+
          # - { torch: '2.9.0', cuda: '12.6.2' } 
          
          # PyTorch 2.12 supports 12.6 and 13.x
          # - { torch: '2.12.0', cuda: '12.6.2' }
          - { torch: '2.12.0', cuda: '13.0.1' }
        
    container:
      # Hardcode ubuntu22.04 for all CUDA versions
      image: nvidia/cuda:${{ matrix.config.cuda }}-devel-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies and Python via Deadsnakes
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y software-properties-common build-essential git wget curl
          
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          
          # Install target Python versions at once
          apt-get install -y python3.11 python3.11-dev python3.11-venv python3.11-distutils
          apt-get install -y python3.12 python3.12-dev python3.12-venv

          # Bootstrap pip globally for both versions
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          python3.11 get-pip.py
          python3.12 get-pip.py

      - name: Format CUDA version for PyTorch
        id: format-cuda
        run: |
          CUDA_SHORT=$(echo ${{ matrix.config.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV

      - name: Compile Wheels for all Python Versions
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
        run: |
          for PY in "python3.11" "python3.12"; do
            echo "Building for $PY..."
            
            $PY -m pip install --upgrade pip setuptools wheel ninja build
            
            # 1. Install PyTorch first from the explicit wheel index
            $PY -m pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
            
            # 2. Install pyproject.toml dependencies + jax extras
            $PY -m pip install -e ".[jax]" --extra-index-url https://download.pytorch.org/whl/${{ env.cu_version }}
            
            # 3. Build the wheel 
            $PY -m build --wheel --no-build-isolation
            
            rm -rf build/ *.egg-info/
          done
      
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-pt${{ matrix.config.torch }}-${{ env.cu_version }}
          path: dist/*.whl

  build_windows_wheels:
    name: Windows (Torch:${{ matrix.config.torch }}, CUDA:${{ matrix.config.cuda }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # PyTorch 2.5 supports older CUDA 12.x
          # - { torch: '2.5.0', cuda: '12.1.1' }
          # - { torch: '2.5.0', cuda: '12.4.0' }
          
          # PyTorch 2.9 dropped 12.4, moved to 12.6+
          # - { torch: '2.9.0', cuda: '12.6.2' } 
          
          # PyTorch 2.12 supports 12.6 and 13.x
          # - { torch: '2.12.0', cuda: '12.6.2' }
          - { torch: '2.12.0', cuda: '13.0.1' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.config.cuda }}
          method: 'network'
          use-github-cache: 'true'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev"]'
          
      - name: Format CUDA version for PyTorch
        shell: bash
        id: format-cuda
        run: |
          CUDA_SHORT=$(echo ${{ matrix.config.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV

      # --- PYTHON 3.11 BUILD ---
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build 3.11 Wheel
        env:
          DISTUTILS_USE_SDK: 1
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          CUDA_HOME: ${{ env.CUDA_PATH }} # Force PyTorch to see the toolkit path 
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja build
          
          # 1. Install PyTorch
          pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          
          # 2. Install pyproject.toml dependencies + jax extras
          pip install -e ".[jax]" --extra-index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          
          # 3. Build Wheel
          python -m build --wheel --no-isolation
          
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force

      # --- PYTHON 3.12 BUILD ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Build 3.12 Wheel
        env:
          DISTUTILS_USE_SDK: 1
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja build
          
          # 1. Install PyTorch
          pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          
          # 2. Install pyproject.toml dependencies + jax extras (Quotes are mandatory in PowerShell)
          pip install -e ".[jax]"
          
          # 3. Build Wheel
          python -m build --wheel --no-isolation
          
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
      
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.config.torch }}-${{ env.cu_version }}
          path: dist/*.whl
          
  publish_gh_pages:
    name: Generate Siloed HTML Indexes and Publish
    needs: [build_ubuntu_wheels, build_windows_wheels]
    runs-on: ubuntu-latest
    # Only publish code if on main branch.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true

      - name: Generate PEP-503 compliant Siloed Indexes
        run: |
          mkdir -p public/whl
          
          # 1. Sort wheels into separate CUDA directories based on their filename tags
          for wheel in wheelhouse/*.whl; do
            filename=$(basename "$wheel")
            
            # Extract the CUDA tag (e.g., cu121, cu124, cu130) from the filename
            if [[ "$filename" =~ (cu[0-9]+) ]]; then
              cuda_tag="${BASH_REMATCH[1]}"
            else
              cuda_tag="cpu"
            fi
            
            # Create a dedicated PEP-503 structure for this CUDA version
            mkdir -p "public/whl/$cuda_tag/eiko"
            cp "$wheel" "public/whl/$cuda_tag/eiko/"
          done

          # 2. Generate index files for each isolated index environment
          cd public/whl
          for dir in cu*; do
            if [ -d "$dir" ]; then
              # Create the top-level index for the specific CUDA channel
              echo "<!DOCTYPE html><html><body><a href=\"eiko/\">eiko</a></body></html>" > "$dir/index.html"
              
              # Create the project-level index listing the wheels
              cd "$dir/eiko"
              echo "<!DOCTYPE html><html><head><title>Links for eiko ($dir)</title></head><body>" > index.html
              echo "<h1>Links for eiko</h1>" >> index.html
              
              for w in *.whl; do
                if [ "$w" != "index.html" ]; then
                  echo "<a href=\"$w\">$w</a><br>" >> index.html
                fi
              done
              
              echo "</body></html>" >> index.html
              cd ../..
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
