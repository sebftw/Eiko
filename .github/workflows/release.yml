name: Package Eiko Multi-Language Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-wheels-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # FIXED: Required to correctly read version tags

      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit (NVCC only)
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with: 
          cuda: '12.1.1'
          method: 'network'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev"]'
      
      - name: Normalize CUDA Path
        id: normalize-path
        run: |
          $CudaPath = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          
          # 1. Fetch the 8.3 short path to eliminate spaces (e.g., C:\PROGRA~1\...)
          $fso = New-Object -ComObject Scripting.FileSystemObject
          $ShortPath = $fso.GetFolder($CudaPath).ShortPath
          
          # 2. Convert backslashes to forward slashes to prevent escape char issues
          $NormalizedPath = $ShortPath -replace '\\', '/'
          
          # 3. Write to GITHUB_OUTPUT enforcing UTF-8 encoding
          "CUDA_PATH_N=$NormalizedPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      
      - name: Add CUDA to PATH
        # Use the newly normalized path for consistency
        run: |
          "${{ steps.normalize-path.outputs.CUDA_PATH_N }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        
      - uses: pypa/cibuildwheel@v2.16
        env:
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_BEFORE_BUILD: |
            pip install ".[jax]" --extra-index-url https://download.pytorch.org/whl/cu121
            python -c "import eiko.eiko_torch; import eiko.eiko_jax"
          CIBW_ENVIRONMENT: >
            TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0+PTX"
            IS_RELEASE_BUILD=1
            CUDA_HOME="${{ steps.normalize-path.outputs.CUDA_PATH_N }}"
            CUDA_PATH="${{ steps.normalize-path.outputs.CUDA_PATH_N }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

  build-wheels-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
  
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # FIXED: Required to correctly read version tags
        
      - uses: pypa/cibuildwheel@v2.16
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
            
          CIBW_BEFORE_ALL: |
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf install -y cuda-nvcc-12-8 cuda-cudart-devel-12-8 cuda-libraries-devel-12-8
            
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_python.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}
          CIBW_ENVIRONMENT: >
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            CUDA_HOME=/usr/local/cuda
            TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0+PTX"
            PIP_EXTRA_INDEX_URL="https://download.pytorch.org/whl/cu121"
            IS_RELEASE_BUILD=1
  
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build-matlab-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.29' # Forces the use of Visual Studio 2019 (v142) compiler tools
      - name: Install CUDA Toolkit (NVCC only)
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with: 
          cuda: '11.8.0'
          method: 'network'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart"]'
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2022b'
          products: 'Parallel_Computing_Toolbox'
      - name: Build MATLAB MEX
        uses: matlab-actions/run-command@v2
        env:
          CUDA_HOME: '${{ steps.cuda-toolkit.outputs.CUDA_PATH }}'
          IS_RELEASE_BUILD: '1'
        with:
          command: mex -setup C++; mexcuda -setup; addpath(genpath(pwd)); build_release();
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-mex-windows
          path: ./matlab/eiko/+eiko_lib/*.mexw64

  build-matlab-linux:
    runs-on: ubuntu-22.04
    container: 
      image: nvidia/cuda:12.1.1-devel-ubuntu20.04
    steps:
      - name: Install Prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git curl zip unzip software-properties-common python3-pip
      - uses: actions/checkout@v4
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2021b'
          products: 'Parallel_Computing_Toolbox'
      - name: Build MATLAB MEX
        uses: matlab-actions/run-command@v2
        env:
          CUDA_HOME: '/usr/local/cuda'
          IS_RELEASE_BUILD: '1'
        with:
          command: mex -setup C++; mexcuda -setup; addpath(genpath(pwd)); build_release(); # FIXED: Replaced github.workspace with pwd
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-mex-linux
          path: ./matlab/eiko/+eiko_lib/*.mexa64

  merge-and-release:
    needs: [build-wheels-windows, build-wheels-linux, build-matlab-linux, build-matlab-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-downloads
          
      - name: Gather Release Files
        run: |
          mkdir -p final-release
          find raw-downloads -name "*.whl" -exec cp {} final-release/ \;
          find raw-downloads -name "*.mexw64" -exec cp {} final-release/ \;
          find raw-downloads -name "*.mexa64" -exec cp {} final-release/ \;

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}