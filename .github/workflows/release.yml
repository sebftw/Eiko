name: Package Eiko Multi-Language Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_ubuntu_wheels:
    name: Ubuntu ${{ matrix.config.os_version }} (Python:${{ matrix.config.python }}, Torch:${{ matrix.config.torch }}, CUDA:${{ matrix.config.cuda }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # 1. The Legacy Baseline (Maximum Compatibility)
          # - Oldest supported Python (3.8) and PyTorch (2.4.0)
          # - Compiling on 22.04's glibc ensures it works natively on 24.04+
          - { torch: '2.4.0', cuda: '12.1.0', os_version: '20.04', python: '3.8' }
            
          # 2. The Modern Standard (What 90% of your users will actually run)
          # - Previous stable PyTorch on a highly adopted Python version
          # - { torch: '2.11.0', cuda: '13.0.1', os_version: '22.04', python: '3.12' }
          # - { torch: '2.11.0', cuda: '13.0.1', os_version: '22.04', python: '3.13' }
            
          # 3. The Bleeding Edge (Future-proofing)
          # - Used to catch compiler warnings, deprecations, and OS-level quirks early
          # - { torch: '2.12.0', cuda: '13.2.0', os_version: '24.04', python: '3.14' }
        
        
    container:
      # Use a NVIDIA CUDA container for compilation
      image: nvidia/cuda:${{ matrix.config.cuda }}-devel-ubuntu${{ matrix.config.os_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Python via Deadsnakes
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          apt-get update
          apt-get install -y software-properties-common build-essential git wget curl ca-certificates
          
          # Add deadsnakes PPA to get modern Python on older Ubuntu versions
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          
          # Install the specific Python version dictated by the matrix
          apt-get install -y python${{ matrix.config.python }} python${{ matrix.config.python }}-dev python${{ matrix.config.python }}-venv
          
          # Conditionally install distutils (Required for <3.12 to run get-pip.py)
          if apt-cache show python${{ matrix.config.python }}-distutils > /dev/null 2>&1; then
            apt-get install -y python${{ matrix.config.python }}-distutils
          fi
          
          # Dynamically choose the correct get-pip URL based on Python version
          if [ "${{ matrix.config.python }}" = "3.8" ] || [ "${{ matrix.config.python }}" = "3.9" ]; then
            PIP_URL="https://bootstrap.pypa.io/pip/${{ matrix.config.python }}/get-pip.py"
          else
            PIP_URL="https://bootstrap.pypa.io/get-pip.py"
          fi
          
          # Bootstrap pip directly into this Python version
          curl -sS $PIP_URL -o get-pip.py
          python${{ matrix.config.python }} get-pip.py

      - name: Format CUDA version for PyTorch
        id: format-cuda
        run: |
          CUDA_SHORT=$(echo ${{ matrix.config.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV

      - name: Determine Target manylinux Platform
        id: set-plat
        run: |
          if [ "${{ matrix.config.os_version }}" = "20.04" ]; then
            echo "PLAT=manylinux_2_31_x86_64" >> $GITHUB_ENV
          elif [ "${{ matrix.config.os_version }}" = "22.04" ]; then
            echo "PLAT=manylinux_2_35_x86_64" >> $GITHUB_ENV
          elif [ "${{ matrix.config.os_version }}" = "24.04" ]; then
            echo "PLAT=manylinux_2_39_x86_64" >> $GITHUB_ENV
          else
            echo "PLAT=linux_x86_64" >> $GITHUB_ENV # Fallback
          fi
      
      # Straightforward compilation step (No bash loops, no mid-job cleanup required)
      - name: Compile Wheel
        env:
          FORCE_CUDA: "1"
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_ROOT_USER_ACTION: "ignore"
          EIKO_RELEASE_BUILD: "1"
          PIP_NO_CACHE_DIR: "1"
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          echo "Building for Python ${{ matrix.config.python }}..."
          
          python${{ matrix.config.python }} -m pip install --upgrade pip
          python${{ matrix.config.python }} -m pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja auditwheel "patchelf>=0.14"
          
          # Install PyTorch from the explicit wheel index, along with JAX
          python${{ matrix.config.python }} -m pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          python${{ matrix.config.python }} -m pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          
          # Build the wheel 
          python${{ matrix.config.python }} -m build --wheel --no-isolation

          # Repair the wheel for cross-distro compatibility (excluding PyTorch binaries)
          echo "Repairing wheel with auditwheel..."
          python${{ matrix.config.python }} -m auditwheel repair dist/*.whl \
            --plat $PLAT \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_python.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so \
            --exclude libbackend_with_compiler.so \
            --exclude libjitbackend_test.so \
            --exclude libcudart.so \
            --exclude libcudart.so.11.0 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.12.0 \
            -w repaired_dist/
          
          # Replace original wheel with the repaired many-linux wheel
          rm dist/*.whl
          mv repaired_dist/*.whl dist/

          # --- VERIFICATION STEP ---
          echo "Verifying Wheel Contents..."          
          
          # List files and look for the vendored .libs directory auditwheel creates
          WHEEL_FILES=$(unzip -l dist/*.whl)
          echo "$WHEEL_FILES"
          
          # Check if any forbidden libraries leaked into the wheel
          if echo "$WHEEL_FILES" | grep -E "eiko\.libs/lib(torch|c10|cuda)" > /dev/null; then
            echo "ERROR: Auditwheel accidentally bundled PyTorch or CUDA libraries!"
            echo "$WHEEL_FILES" | grep -E "eiko\.libs/lib(torch|c10|cuda)"
            exit 1
          else
            echo "Success: No heavy external runtimes were bundled inside the wheel."
          fi          
      
      # 5. Upload artifacts (Ensure names are unique per Python version)
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu${{ matrix.config.os_version }}-pt${{ matrix.config.torch }}-${{ env.cu_version }}-py${{ matrix.config.python }}
          path: dist/*.whl

  build_windows_wheels:
    name: Windows (Torch:${{ matrix.config.torch }}, CUDA:${{ matrix.config.cuda }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # PyTorch 2.5 supports older CUDA 12.x
          # - { torch: '2.5.0', cuda: '12.1.1' }
          # - { torch: '2.5.0', cuda: '12.4.0' }
          
          # PyTorch 2.9 dropped 12.4, moved to 12.6+
          # - { torch: '2.9.0', cuda: '12.6.2' } 
          
          # PyTorch 2.12 supports 12.6 and 13.x
          - { torch: '2.12.0', cuda: '12.6.2' }
          # - { torch: '2.12.0', cuda: '13.0.1' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.config.cuda }}
          method: 'network'
          use-github-cache: 'true'
          # sub-packages: '["nvcc", "visual_studio_integration", "thrust", "cudart"]'
          
      - name: Format CUDA version and PATHs for PyTorch
        shell: bash
        id: format-cuda
        run: |
          # Format CUDA version string
          CUDA_SHORT=$(echo ${{ matrix.config.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV

          # Set CUDA PATHs
          echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "CUDA_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin" >> $GITHUB_PATH
          

      - name: Verify CUDA_HOME
        run: |
          echo "The CUDA_HOME variable is currently set to: $env:CUDA_HOME"
          echo "Testing if nvcc is accessible:"
          nvcc --version
      
      # --- PYTHON 3.11 BUILD ---
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build 3.11 Wheel
        env:
          DISTUTILS_USE_SDK: "1"  # Crucial: Tells setuptools to use the active MSVC env
          FORCE_CUDA: "1"        # Forces compilation even if runtime check fails (there is no GPU attached)
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_NO_CACHE_DIR: "1"
          CUDA_HOME: ${{ env.CUDA_PATH }} # Force PyTorch to see the toolkit path
          EIKO_RELEASE_BUILD: "1"
        run: |
          # Install PyTorch and JAX (+pybind11)
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax pybind11
          
          # Build Wheel
          python -m build --wheel --no-isolation
          
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force

      # --- PYTHON 3.12 BUILD ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Build 3.12 Wheel
        env:
          DISTUTILS_USE_SDK: "1"  # Crucial: Tells setuptools to use the active MSVC env
          FORCE_CUDA: "1"        # Forces compilation even if runtime check fails (there is no GPU attached)
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_NO_CACHE_DIR: "1"
          CUDA_HOME: ${{ env.CUDA_PATH }} # Force PyTorch to see the toolkit path 
          EIKO_RELEASE_BUILD: "1"
        run: |
          # Install PyTorch and JAX (+pybind11)
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax pybind11
          
          # Build Wheel
          python -m build --wheel --no-isolation
          
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
      
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.config.torch }}-${{ env.cu_version }}
          path: dist/*.whl
          
  publish_gh_pages:
    name: Generate Siloed HTML Indexes and Publish
    needs: [build_ubuntu_wheels, build_windows_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages branch to preserve history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
        continue-on-error: true # Fails gracefully if this is the first ever release

      - name: Create fallback directory
        run: mkdir -p public

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true

      - name: Generate PEP-503 compliant Siloed Indexes
        run: |
          # Prevent bash from looping over literal '*.whl' if the directory is empty
          shopt -s nullglob
          
          mkdir -p public/whl
          
          # 1. Sort NEW wheels into the existing PEP-503 structure
          for wheel in wheelhouse/*.whl; do
            filename=$(basename "$wheel")
            
            if [[ "$filename" =~ (cu[0-9]+) ]]; then
              cuda_tag="${BASH_REMATCH[1]}"
            else
              cuda_tag="cpu"
            fi
            
            mkdir -p "public/whl/$cuda_tag/eiko"
            cp "$wheel" "public/whl/$cuda_tag/eiko/"
          done

          # 2. Regenerate index files for ALL wheels (old + new)
          cd public/whl
          for dir in cu*; do
            if [ -d "$dir" ]; then
              echo "<!DOCTYPE html><html><body><a href=\"eiko/\">eiko</a></body></html>" > "$dir/index.html"
              
              cd "$dir/eiko"
              echo "<!DOCTYPE html><html><head><title>Links for eiko ($dir)</title></head><body>" > index.html
              echo "<h1>Links for eiko</h1>" >> index.html
              
              for w in *.whl; do
                if [ "$w" != "index.html" ]; then
                  echo "<a href=\"$w\">$w</a><br>" >> index.html
                fi
              done
              
              echo "</body></html>" >> index.html
              cd ../..
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
