name: Package Eiko Multi-Language Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11'] 
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: '12.1.1'
          method: 'network'

      - name: Set up MATLAB
        if: matrix.python-version == '3.11'
        uses: matlab-actions/setup-matlab@v2

      - name: Build MATLAB Toolbox
        if: matrix.python-version == '3.11'
        uses: matlab-actions/run-command@v2
        with:
          command: build_release()

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Python Wheels
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel

      - name: Upload Raw Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-assets-windows-py${{ matrix.python-version }}
          path: |
            releases/*.mltbx
            dist/*.whl

  build-linux:
    runs-on: ubuntu-latest
    # This mounts an Ubuntu 20.04 environment with CUDA 12.1 built-in
    container: 
      image: nvidia/cuda:12.1.1-devel-ubuntu20.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11'] 
    steps:
      # Bare containers lack basic tools; install them so the GitHub setup actions work
      - name: Install Container Prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git curl zip unzip

      - uses: actions/checkout@v4

      # Note: No Jimver/cuda-toolkit action needed here! NVCC is natively available.

      - name: Set up MATLAB
        if: matrix.python-version == '3.11'
        uses: matlab-actions/setup-matlab@v2

      - name: Build MATLAB Toolbox
        if: matrix.python-version == '3.11'
        uses: matlab-actions/run-command@v2
        with:
          command: build_release()

      - name: Install Python ${{ matrix.python-version }}
        run: |
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python${{ matrix.python-version }} python${{ matrix.python-version }}-venv python${{ matrix.python-version }}-dev
          # Create a virtual environment to safely isolate the Python build
          python${{ matrix.python-version }} -m venv /opt/venv

      - name: Build Python Wheels
        run: |
          # Activate the venv and build the wheel
          . /opt/venv/bin/activate
          python -m pip install --upgrade pip build wheel
          python -m build --wheel

      - name: Upload Raw Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-assets-linux-py${{ matrix.python-version }}
          path: |
            releases/*.mltbx
            dist/*.whl

  merge-and-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Raw Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-downloads

      - name: Merge and Repackage Cross-Platform MATLAB Toolbox
        run: |
          mkdir -p unified-toolbox/extracted_win unified-toolbox/extracted_lin unified-toolbox/merged/+eiko_lib
          
          # Isolate toolboxes by OS source
          WIN_MLTBX=$(find raw-downloads -name "*.mltbx" | grep "windows" | head -n 1)
          unzip -q "$WIN_MLTBX" -d unified-toolbox/extracted_win
          
          LIN_MLTBX=$(find raw-downloads -name "*.mltbx" | grep "linux" | head -n 1)
          unzip -q "$LIN_MLTBX" -d unified-toolbox/extracted_lin
          
          cp -r unified-toolbox/extracted_win/* unified-toolbox/merged/
          cp unified-toolbox/extracted_lin/fs/matlab/eiko/+eiko_lib/*.mexa64 unified-toolbox/merged/fs/matlab/eiko/+eiko_lib/ 2>/dev/null || true
          
          mkdir -p final-release
          cd unified-toolbox/merged && zip -q -r ../../final-release/Eiko-Universal.mltbx * && cd ../..
          
          find raw-downloads -name "*.whl" -exec cp {} final-release/ \;

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
