name: Package Eiko Multi-Language Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-wheels-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.8.0'
            torch_tag: 'cu128'
          - cuda: '13.0.0'
            torch_tag: 'cu130'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with: 
          cuda: ${{ matrix.cuda }}
          method: 'network'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev"]'
       
      - name: Set Global CUDA Environment Variables
        run: |
          echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $env:GITHUB_ENV
          echo "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin" >> $env:GITHUB_PATH
       
      - uses: pypa/cibuildwheel@v2.16
        env:
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BUILD: "cp310-*"
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          
          CIBW_BEFORE_BUILD: >
            pip install ninja setuptools>=61.0.0 wheel "torch>=2.0.0" jax pybind11 --extra-index-url https://download.pytorch.org/whl/${{ matrix.torch_tag }}
            
          CIBW_ENVIRONMENT: >
            TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0+PTX"
            IS_RELEASE_BUILD=1
            MAX_JOBS=4

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-cuda${{ matrix.cuda }}
          path: ./wheelhouse/*.whl

  build-wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.8.0'
            torch_tag: 'cu128'
            dnf_tag: '12-8'
          - cuda: '13.0.0'
            torch_tag: 'cu130'
            dnf_tag: '13-0'
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
  
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - uses: pypa/cibuildwheel@v2.16
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: "cp310-*"
          
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          
          CIBW_BEFORE_BUILD: >
            pip install setuptools>=61.0.0 wheel &&
            pip install torch>=2.0.0 --extra-index-url https://download.pytorch.org/whl/${{ matrix.torch_tag }} &&
            pip install jax pybind11
            
          CIBW_BEFORE_ALL: |
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf install -y cuda-nvcc-${{ matrix.dnf_tag }} cuda-cudart-devel-${{ matrix.dnf_tag }} cuda-libraries-devel-${{ matrix.dnf_tag }}
          
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_python.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}
            
          CIBW_ENVIRONMENT: >
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            CUDA_HOME=/usr/local/cuda
            TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0+PTX"
            PIP_EXTRA_INDEX_URL="https://download.pytorch.org/whl/${{ matrix.torch_tag }}"
            IS_RELEASE_BUILD=1
  
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cuda${{ matrix.cuda }}
          path: ./wheelhouse/*.whl

  build-matlab-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.29'
      - name: Install CUDA Toolkit (NVCC only)
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with: 
          cuda: '11.8.0'
          method: 'network'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart"]'
       
      - name: Clone NVIDIA CCCL (Thrust/CUB)
        run: git clone https://github.com/NVIDIA/cccl.git ${{ github.workspace }}\cccl
        
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2022b'
          products: 'Parallel_Computing_Toolbox'
      - name: Build MATLAB MEX
        uses: matlab-actions/run-command@v2
        env:
          MW_NVCC_PATH: '${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin\nvcc.exe'
          CUDA_HOME: '${{ steps.cuda-toolkit.outputs.CUDA_PATH }}'
          IS_RELEASE_BUILD: '1'
          CCCL_ROOT: ${{ github.workspace }}\cccl
        with:
          command: mex -setup C++; addpath(genpath(pwd)); build_release();
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-mex-windows
          path: ./matlab/eiko/+eiko_lib/*.mexw64

  build-matlab-linux:
    runs-on: ubuntu-22.04
    container: 
      image: nvidia/cuda:12.1.1-devel-ubuntu20.04
    steps:
      - name: Install Prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git curl zip unzip software-properties-common python3-pip
      - uses: actions/checkout@v4
      - name: Clone NVIDIA CCCL (Thrust/CUB)
        run: git clone https://github.com/NVIDIA/cccl.git ${{ github.workspace }}/cccl
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2021b'
          products: 'Parallel_Computing_Toolbox'
      - name: Build MATLAB MEX
        uses: matlab-actions/run-command@v2
        env:
          MW_NVCC_PATH: '/usr/local/cuda/bin/nvcc'
          CUDA_HOME: '/usr/local/cuda'
          IS_RELEASE_BUILD: '1'
        with:
          command: mex -setup C++; mexcuda -setup; addpath(genpath(pwd)); build_release();
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-mex-linux
          path: ./matlab/eiko/+eiko_lib/*.mexa64

  merge-and-release:
    needs: [build-wheels-windows, build-wheels-linux, build-matlab-linux, build-matlab-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-downloads
          
      - name: Gather Release Files
        run: |
          mkdir -p final-release
          find raw-downloads -name "*.whl" -exec cp {} final-release/ \;
          find raw-downloads -name "*.mexw64" -exec cp {} final-release/ \;
          find raw-downloads -name "*.mexa64" -exec cp {} final-release/ \;

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}