name: Package Eiko Multi-Language Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_ubuntu_wheels:
    name: Ubuntu ${{ matrix.platform.os_version }} (Python:${{ matrix.python_version }}, Torch:${{ matrix.platform.torch }}, CUDA:${{ matrix.platform.cuda }})
    if: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          # --- Legacy Floor (Max Backwards Compatibility) ---
          - { torch: '2.4.0', cuda: '12.4.1', os_version: '20.04' }
          # - { torch: '2.7.0', cuda: '12.6.3', os_version: '20.04' }

          # --- Standard Production Baseline (Python 3.11 / 3.12 focus) ---
          # - { torch: '2.4.0', cuda: '12.1.1', os_version: '22.04' } # This might seem redundant if we already have 20.04, but it is used to target a newer Python version.
          # - { torch: '2.10.0', cuda: '12.8.2', os_version: '22.04' }
          # - { torch: '2.12.0', cuda: '12.6.0', os_version: '22.04' }

          # --- Next-Gen Tier (CUDA 13+) ---
          # - { torch: '2.12.0', cuda: '13.0.3', os_version: '24.04' }
          # - { torch: '2.12.0', cuda: '13.2.0', os_version: '24.04' }

        # Target active Python versions
        python_version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
  
        exclude:
          # ==========================================================
          # 1. HARD OS CONSTRAINTS (Ubuntu 20.04 SSL/GLIBC Limitations)
          # ==========================================================
          # Drop Python 3.10+ on Ubuntu 20.04 across all applicable torch/cuda pairs
          - platform: { os_version: '20.04' }
            python_version: '3.10'
          - platform: { os_version: '20.04' }
            python_version: '3.11'
          - platform: { os_version: '20.04' }
            python_version: '3.12'
          - platform: { os_version: '20.04' }
            python_version: '3.13'

          # ==========================================================
          # 2. PYTORCH VS PYTHON VERSION COMPATIBILITY DROPS
          # ==========================================================
          # PyTorch 2.4 does not support Python 3.13
          - platform: { torch: '2.4.0' }
            python_version: '3.13'

          # PyTorch 2.10+ explicitly drops Python 3.9 support
          - platform: { torch: '2.10.0' }
            python_version: '3.9'
          - platform: { torch: '2.11.0' }
            python_version: '3.9'
          - platform: { torch: '2.12.0' }
            python_version: '3.9'
            
          # ==========================================================
          # 3. OPTIONAL OS DESIGN CHOICE EXCLUSIONS
          # ==========================================================
          # Exclude Python 3.9 from running on newer Ubuntu baselines
          - platform: { os_version: '22.04' }
            python_version: '3.9'
          - platform: { os_version: '24.04' }
            python_version: '3.9'

          # Exclude older Pythons from Ubuntu 24.04 to focus strictly on modern runtimes
          - platform: { os_version: '24.04' }
            python_version: '3.10'
          - platform: { os_version: '24.04' }
            python_version: '3.11'

          # ==========================================================
          # Clean up Python 3.8 for all modern tiers
          # ==========================================================
          # Python 3.8 is EOL; explicitly skip it on Ubuntu 22.04 and 24.04
          - platform: { os_version: '22.04' }
            python_version: '3.8'
          - platform: { os_version: '24.04' }
            python_version: '3.8'

          # PyTorch 2.7+ completely dropped Python 3.8 support globally
          - platform: { torch: '2.7.0' }
            python_version: '3.8'
          - platform: { torch: '2.10.0' }
            python_version: '3.8'
          - platform: { torch: '2.11.0' }
            python_version: '3.8'
          - platform: { torch: '2.12.0' }
            python_version: '3.8'
        
        
    container:
      # Use a NVIDIA CUDA container for compilation
      image: nvidia/cuda:${{ matrix.platform.cuda }}-devel-ubuntu${{ matrix.platform.os_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install System Dependencies & Python via Deadsnakes
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          apt-get update
          apt-get install -y software-properties-common build-essential git wget curl ca-certificates unzip
          
          # Add deadsnakes PPA to get modern Python on older Ubuntu versions
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          
          # Install the specific Python version dictated by the matrix
          apt-get install -y python${{ matrix.python_version }} python${{ matrix.python_version }}-dev python${{ matrix.python_version }}-venv
          
          # Conditionally install distutils (Required for <3.12 to run get-pip.py)
          if apt-cache show python${{ matrix.python_version }}-distutils > /dev/null 2>&1; then
            apt-get install -y python${{ matrix.python_version }}-distutils
          fi
          
          # Dynamically choose the correct get-pip URL based on Python version
          if [ "${{ matrix.python_version }}" = "3.8" ] || [ "${{ matrix.python_version }}" = "3.9" ]; then
            PIP_URL="https://bootstrap.pypa.io/pip/${{ matrix.python_version }}/get-pip.py"
          else
            PIP_URL="https://bootstrap.pypa.io/get-pip.py"
          fi
          
          # Bootstrap pip directly into this Python version
          curl -sS $PIP_URL -o get-pip.py
          python${{ matrix.python_version }} get-pip.py

      - name: Format CUDA version for PyTorch
        id: format-cuda
        run: |
          CUDA_SHORT=$(echo ${{ matrix.platform.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV

      - name: Determine Target manylinux Platform
        id: set-plat
        run: |
          if [ "${{ matrix.platform.os_version }}" = "20.04" ]; then
            echo "PLAT=manylinux_2_31_x86_64" >> $GITHUB_ENV
          elif [ "${{ matrix.platform.os_version }}" = "22.04" ]; then
            echo "PLAT=manylinux_2_35_x86_64" >> $GITHUB_ENV
          elif [ "${{ matrix.platform.os_version }}" = "24.04" ]; then
            echo "PLAT=manylinux_2_39_x86_64" >> $GITHUB_ENV
          else
            echo "PLAT=linux_x86_64" >> $GITHUB_ENV # Fallback
          fi
      
      # Straightforward compilation step (No bash loops, no mid-job cleanup required)
      - name: Compile Wheel
        if: ${{ !(matrix.platform.os_version == '20.04' && matrix.python_version == '3.8') }}
        env:
          FORCE_CUDA: "1"
          TORCH_CUDA_ARCH_LIST: "6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.platform.torch }}${{ env.cu_version }}"
          PIP_ROOT_USER_ACTION: "ignore"
          EIKO_RELEASE_BUILD: "1"
          PIP_NO_CACHE_DIR: "1"
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          echo "Building for Python ${{ matrix.python_version }}..."
          
          python${{ matrix.python_version }} -m pip install --upgrade pip
          python${{ matrix.python_version }} -m pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja auditwheel "patchelf>=0.14"
          
          # Install PyTorch from the explicit wheel index, along with JAX
          python${{ matrix.python_version }} -m pip install torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          python${{ matrix.python_version }} -m pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          
          # Build the wheel 
          python${{ matrix.python_version }} -m build --wheel --no-isolation

          # Repair the wheel for cross-distro compatibility (excluding PyTorch binaries)
          echo "Repairing wheel with auditwheel..."
          python${{ matrix.python_version }} -m auditwheel repair dist/*.whl \
            --plat $PLAT \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_python.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so \
            --exclude libbackend_with_compiler.so \
            --exclude libjitbackend_test.so \
            --exclude libcudart.so \
            --exclude libcudart.so.11.0 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.12.0 \
            --exclude libcudart.so.13 \
            --exclude libcudart.so.13.2 \
            --exclude _xla.so \
            --exclude xla_extension.so \
            --exclude libjax_cuda_plugin.so \
            --exclude libjax_cuda_pjrt.so \
            --exclude libnvrtc.so \
            --exclude libnvidia-ml.so \
            --exclude libnccl.so \
            --exclude libgomp.so.1 \
            --exclude libcublas.so \
            --exclude libcublasLt.so \
            -w repaired_dist/

          # Safely rewrite the tags to ONLY use the requested $PLAT
          echo "Stripping redundant platform tags..."
          cd repaired_dist
          python${{ matrix.python_version }} -m wheel tags --platform-tag $PLAT *.whl --remove
          cd ..
          
          # Replace original wheel with the repaired many-linux wheel
          rm dist/*.whl
          mv repaired_dist/*.whl dist/

          # --- VERIFICATION STEP ---
          echo "Verifying Wheel Contents..."          
          
          # List files and look for the vendored .libs directory auditwheel creates
          WHEEL_FILES=$(unzip -l dist/*.whl)
          echo "$WHEEL_FILES"
          
          # Check if any forbidden libraries leaked into the wheel
          if echo "$WHEEL_FILES" | grep -E "eiko\.libs/(lib(torch|c10|cuda|jax|nvrtc|nvidia|nccl|gomp|cublas)|_xla|xla_)" > /dev/null; then
            echo "ERROR: Auditwheel accidentally bundled PyTorch/JAX or CUDA libraries!"
            echo "$WHEEL_FILES" | grep -E "eiko\.libs/(lib(torch|c10|cuda|jax|nvrtc|nvidia|nccl|gomp|cublas)|_xla|xla_)"
            exit 1
          else
            echo "Success: No heavy external runtimes were bundled inside the wheel."
          fi
      
      # ==========================================
      # EDGE CASE PATH (Ubuntu 20.04 + Python 3.8)
      # ==========================================
      - name: Compile Wheels (Isolated venv & Merge)
        if: ${{ matrix.platform.os_version == '20.04' && matrix.python_version == '3.8' }}
        env:
          FORCE_CUDA: "1"
          TORCH_CUDA_ARCH_LIST: "6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.platform.torch }}${{ env.cu_version }}"
          PIP_ROOT_USER_ACTION: "ignore"
          EIKO_RELEASE_BUILD: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          echo "Handling PyTorch/JAX collision. Building separately and merging..."
          
          # ---------------------------------------------------------
          # 1. BUILD PYTORCH WHEEL
          # ---------------------------------------------------------
          python${{ matrix.python_version }} -m venv /tmp/venv_pt
          export PATH="/tmp/venv_pt/bin:$PATH"

          python -m pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja auditwheel "patchelf>=0.14" pybind11
          python -m pip install "typing-extensions>=4.8.0,<4.9.0" torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          
          # Output PyTorch wheel to a temporary directory
          python -m build --wheel --no-isolation --outdir /tmp/wheel_pt
          
          # ---------------------------------------------------------
          # 2. BUILD JAX WHEEL
          # ---------------------------------------------------------
          # Reset path to system python, then create JAX venv
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" 
          python${{ matrix.python_version }} -m venv /tmp/venv_jax
          export PATH="/tmp/venv_jax/bin:$PATH"
          
          python -m pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja auditwheel "patchelf>=0.14" pybind11
          python -m pip install jax jaxlib -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          
          # Output JAX wheel to a separate temporary directory
          python -m build --wheel --no-isolation --outdir /tmp/wheel_jax
          
          # ---------------------------------------------------------
          # 3. MERGE THE BINARIES INTO A SINGLE WHEEL
          # ---------------------------------------------------------
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          python${{ matrix.python_version }} -m pip install wheel
          
          mkdir -p /tmp/merge_area/pt
          mkdir -p /tmp/merge_area/jax
          
          # Unpack both wheels into directories
          python${{ matrix.python_version }} -m wheel unpack /tmp/wheel_pt/*.whl -d /tmp/merge_area/pt
          python${{ matrix.python_version }} -m wheel unpack /tmp/wheel_jax/*.whl -d /tmp/merge_area/jax
          
          # Get the unzipped folder name (e.g., eiko-0.8.5)
          WHEEL_DIR=$(ls /tmp/merge_area/pt)
          
          # Copy only the compiled JAX .so binaries into the PyTorch wheel structure
          # Using -n ensures we don't accidentally overwrite any shared python files
          cp -n /tmp/merge_area/jax/$WHEEL_DIR/eiko/*.so /tmp/merge_area/pt/$WHEEL_DIR/eiko/ || true
          
          # Repack the merged directory into your standard 'dist/' folder
          mkdir -p dist
          python${{ matrix.python_version }} -m wheel pack /tmp/merge_area/pt/$WHEEL_DIR -d dist/
          
          # ---------------------------------------------------------
          # 4. REPAIR THE MERGED WHEEL
          # ---------------------------------------------------------
          echo "Repairing merged wheel with auditwheel..."
          # Use the venv Python that already has auditwheel and patchelf ready
          /tmp/venv_jax/bin/python -m auditwheel repair dist/*.whl \
            --plat $PLAT \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_python.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so \
            --exclude libbackend_with_compiler.so \
            --exclude libjitbackend_test.so \
            --exclude libcudart.so \
            --exclude libcudart.so.11.0 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.12.0 \
            --exclude libcudart.so.13 \
            --exclude libcudart.so.13.2 \
            --exclude _xla.so \
            --exclude xla_extension.so \
            --exclude libjax_cuda_plugin.so \
            --exclude libjax_cuda_pjrt.so \
            --exclude libnvrtc.so \
            --exclude libnvidia-ml.so \
            --exclude libnccl.so \
            --exclude libgomp.so.1 \
            --exclude libcublas.so \
            --exclude libcublasLt.so \
            -w repaired_dist/
            
          echo "Stripping redundant platform tags..."
          cd repaired_dist
          # python${{ matrix.python_version }} -m wheel tags --platform-tag $PLAT *.whl --remove
          # Use the venv python here as well to ensure wheel is available
          /tmp/venv_jax/bin/python -m wheel tags --platform-tag $PLAT *.whl --remove
          cd ..
          
          # Replace original unpacked wheel with the repaired many-linux wheel
          rm dist/*.whl
          mv repaired_dist/*.whl dist/
      
      # 5. Upload artifacts (Ensure names are unique per Python version)
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu${{ matrix.platform.os_version }}-pt${{ matrix.platform.torch }}-${{ env.cu_version }}-py${{ matrix.python_version }}
          path: dist/*.whl

  build_windows_wheels:
    name: Windows (Torch:${{ matrix.platform.torch }}, CUDA:${{ matrix.platform.cuda }})
    runs-on: windows-latest
    if: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          # --- Legacy Baseline (Broad Hardware Support) ---
          # - { torch: '2.4.0', cuda: '12.1.1' }
          # - { torch: '2.7.0', cuda: '12.6.3' }
  
          # --- Transition Tier ---
          # - { torch: '2.10.0', cuda: '12.8.1' }
  
          # --- Modern Standard & Next-Gen Architecture ---
          # 12.6.0 provides a modern runtime for older GPUs (e.g., Pascal/Ampere)
          - { torch: '2.12.0', cuda: '12.6.0' }
          # 13.2.0 provides cutting-edge optimization for Blackwell/Hopper architectures
          # - { torch: '2.12.0', cuda: '13.0.3' }
          # - { torch: '2.12.0', cuda: '13.2.0' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.platform.cuda }}
          method: 'network'
          use-github-cache: 'true'
          # sub-packages: '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev", "visual_studio_integration"]'
          
      - name: Format CUDA version and PATHs for PyTorch
        shell: bash
        id: format-cuda
        run: |
          # Format CUDA version string
          CUDA_SHORT=$(echo ${{ matrix.platform.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV

          # Set CUDA PATHs
          echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "CUDA_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin" >> $GITHUB_PATH
          
      - name: Verify CUDA_HOME
        run: |
          echo "The CUDA_HOME variable is currently set to: $env:CUDA_HOME"
          echo "Testing if nvcc is accessible:"
          nvcc --version

      # ==========================================
      # PYTHON 3.9 BUILD
      # Excluded for PyTorch 2.10+ (Requires 3.10+)
      # ==========================================
      - name: Set up Python 3.9
        if: matrix.platform.torch != '2.12.0' && matrix.platform.torch != '2.11.0' && matrix.platform.torch != '2.10.0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install MSVC v144 Toolset
        run: |
          # Use VSLocator / vswhere or the VS Installer CLI to add the VS 2022 build tools component
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" `
            --add Microsoft.VisualStudio.Component.VC.14.40.x86.x64 `
            --passive --norestart --includeRecommended
            
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.40' # Forces a CUDA 12.6-compatible compiler version
          
      # --- PYTHON 3.9 BUILD ---
      - name: Build 3.9 Wheel
        if: matrix.platform.torch != '2.12.0' && matrix.platform.torch != '2.11.0' && matrix.platform.torch != '2.10.0'
        env: &build_env
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"
          # Force 64-bit targeting for setuptools/distutils
          TARGET_ARCH: "x64"
          VSCMD_ARG_TGT_ARCH: "x64"
          CUDAHOSTCXX: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.40.33807/bin/Hostx64/x64/cl.exe"
          FORCE_CUDA: "1"
          TORCH_CUDA_ARCH_LIST: "6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0;12.0+PTX"
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.platform.torch }}${{ env.cu_version }}"
          PIP_NO_CACHE_DIR: "1"
          CUDA_HOME: ${{ env.CUDA_PATH }} 
          EIKO_RELEASE_BUILD: "1"
        run: |
          where cl.exe
          cl.exe # This will print the MSVC compiler banner showing the target architecture
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          python -m build --wheel --no-isolation
          pip uninstall torch jax -y

      - name: Upload 3.9 Wheel
        if: matrix.platform.torch != '2.12.0' && matrix.platform.torch != '2.11.0' && matrix.platform.torch != '2.10.0'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.platform.torch }}-${{ env.cu_version }}-py3.9
          path: dist/*.whl
          
      - name: Clean 3.9 Workspace
        if: matrix.platform.torch != '2.12.0' && matrix.platform.torch != '2.11.0' && matrix.platform.torch != '2.10.0'
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist\*.whl" }

      # --- PYTHON 3.10 BUILD ---
      # Excluded for PyTorch 2.12+ 
      - name: Set up Python 3.10
        # CHANGE: Uncommented the condition below to prevent running on unconfigured environment
        if: matrix.platform.torch != '2.12.0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          
      - name: Build 3.10 Wheel
        # CHANGE: Uncommented the condition below to align with setup inclusion rules
        if: matrix.platform.torch != '2.12.0'
        env: *build_env
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          python -m build --wheel --no-isolation
          pip uninstall torch jax -y

      - name: Upload 3.10 Wheel
        # CHANGE: Uncommented the condition below to stop empty/failed matrix outputs on 2.12.0
        if: matrix.platform.torch != '2.12.0'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.platform.torch }}-${{ env.cu_version }}-py3.10
          path: dist/*.whl
          
      - name: Clean 3.10 Workspace
        if: matrix.platform.torch != '2.12.0'
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist\*.whl" }
      
      # --- PYTHON 3.11 BUILD ---
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          
      - name: Build 3.11 Wheel
        env: *build_env
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          python -m build --wheel --no-isolation
          pip uninstall torch jax -y

      - name: Upload 3.11 Wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.platform.torch }}-${{ env.cu_version }}-py3.11
          path: dist/*.whl
          
      - name: Clean Build Workspace
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist\*.whl" }

      # --- PYTHON 3.12 BUILD ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          
      - name: Build 3.12 Wheel
        env: *build_env
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          python -m build --wheel --no-isolation
          pip uninstall torch jax -y

      - name: Upload 3.12 Wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.platform.torch }}-${{ env.cu_version }}-py3.12
          path: dist/*.whl
          
      - name: Clean 3.12 Workspace
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist\*.whl" }

      # --- PYTHON 3.13 BUILD ---
      # Excluded for PyTorch 2.4.0
      # Excluded for PyTorch 2.10 + CUDA 12.8 (missing binaries)
      - name: Set up Python 3.13
        # CHANGE: Swapped matrix.platform.cuda for env.cu_version matching your wheel download pattern
        if: matrix.platform.torch != '2.4.0' && !(matrix.platform.torch == '2.10.0' && env.cu_version == 'cu128')
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          
      - name: Build 3.13 Wheel
        # CHANGE: Swapped matrix.platform.cuda for env.cu_version matching your wheel download pattern
        if: matrix.platform.torch != '2.4.0' && !(matrix.platform.torch == '2.10.0' && env.cu_version == 'cu128')
        env: *build_env
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel ninja
          pip install torch==${{ matrix.platform.torch }} --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax jaxlib pybind11 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
          python -m build --wheel --no-isolation
          pip uninstall torch jax -y

      - name: Upload 3.13 Wheel
        # CHANGE: Swapped matrix.platform.cuda for env.cu_version matching your wheel download pattern
        if: matrix.platform.torch != '2.4.0' && !(matrix.platform.torch == '2.10.0' && env.cu_version == 'cu128')
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.platform.torch }}-${{ env.cu_version }}-py3.13
          path: dist/*.whl
          
      - name: Clean 3.13 Workspace
        # CHANGE: Swapped matrix.platform.cuda for env.cu_version matching your wheel download pattern
        if: matrix.platform.torch != '2.4.0' && !(matrix.platform.torch == '2.10.0' && env.cu_version == 'cu128')
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist\*.whl" }
          
  build_standard_wheels:
    name: Standard Wheel - Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      # We only need to create a single standard wheel since it only contains Python code (no compiled binaries), meaning it is compatible with any Python 3 version and Operating System.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils

      - name: Compile Standard Wheel
        env:
          EIKO_RELEASE_BUILD: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=61.0.0,<82" "build>=1.2.0" "validate-pyproject>=0.25" wheel
          
          # Build the wheel
          python -m build --wheel --no-isolation

      - name: Upload Standard Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-standard-py${{ matrix.python-version }}
          path: dist/*.whl

    # ==========================================
  # 1. LINUX MATLAB BUILD (CONTAINERIZED)
  # ==========================================
  build_matlab_linux:
    name: MATLAB Build (Linux, CUDA 12.8)
    if: false
    runs-on: ubuntu-22.04
    container:
      # Use the devel image so it includes nvcc and the compiler toolchain
      image: nvidia/cuda:12.8.2-devel-ubuntu20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Utilities for MATLAB Action
        # The NVIDIA base image is barebones. The setup-matlab action requires 
        # wget and unzip to fetch and extract the MATLAB runtime.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y wget unzip ca-certificates build-essential
          apt-get install -y gcc-10 g++-10

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: 'R2021a'
          products: >
            Parallel_Computing_Toolbox

      - name: Run MATLAB Setup Script
        uses: matlab-actions/run-command@v3
        env:
          # Inside the NVIDIA container, nvcc is reliably located here:
          MW_NVCC_PATH: /usr/local/cuda/bin/nvcc
          CUDA_HOME: /usr/local/cuda/
        with:
          command: addpath('matlab/eiko'); eiko_lib.setup('release');

      - name: Upload Linux MEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiko-linux-mex
          path: matlab/eiko/+eiko_lib/*.mexa64
          if-no-files-found: error

  # ==========================================
  # 2. WINDOWS MATLAB BUILD
  # ==========================================
  build_matlab_windows:
    name: MATLAB Build (Windows, CUDA 12.8)
    runs-on: windows-latest
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      #- name: Install Visual Studio 2019 Build Tools
      #  run: choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --norestart" -y
      
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.2'  # Forces the action to locate and activate the MSVC 2019 (v142) compiler

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust"]'
      
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: 'R2021a'
          cache: true
          products: >
            Parallel_Computing_Toolbox

      - name: Run MATLAB Setup Script
        uses: matlab-actions/run-command@v3
        env:
          MW_NVCC_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin\nvcc.exe
          CUDA_HOME: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        with:
          # Force MATLAB to lock in the C++ compiler before running your script
          command: >
            addpath('matlab/eiko'); 
            eiko_lib.setup('release');

      - name: Upload Windows MEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiko-windows-mex
          path: matlab/eiko/+eiko_lib/*.mexw64
          if-no-files-found: error

  # ==========================================
  # 3. COMBINE AND PACKAGE RELEASE
  # ==========================================
  package_matlab_release:
    name: Package Cross-Platform MATLAB Release
    needs: [build_matlab_linux, build_matlab_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Download MEX binaries to a TEMPORARY folder, NOT inside the eiko source tree
      - name: Download Linux MEX
        uses: actions/download-artifact@v4
        with:
          name: eiko-linux-mex
          path: temp_binaries/
          
      - name: Download Windows MEX
        uses: actions/download-artifact@v4
        with:
          name: eiko-windows-mex
          path: temp_binaries/

      - name: Create Pure Source Release Zip
        run: |
          # Copy the C++ source code into the MATLAB package structure
          # This ensures setup() has the files it needs to compile locally
          cp -r src matlab/eiko/+eiko_lib/

          cp temp_binaries/*_R2021a.mexw64 matlab/eiko/+eiko_lib/mex_bindings.mexw64
          cp temp_binaries/*_R2021a.mexa64 matlab/eiko/+eiko_lib/mex_bindings.mexa64
          
          cd matlab
          zip -r eiko_matlab.zip eiko/
          
      - name: Upload Final ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiko-matlab-release
          path: matlab/eiko_matlab.zip
