name: Package Eiko Multi-Language Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Build wheels independently (cibuildwheel handles the matrix of Python versions internally)
  build-wheels-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Replaced manual check with the action. 
      # Method 'network' with sub-packages downloads very quickly.
      - name: Install CUDA Toolkit (NVCC only)
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with: 
          cuda: '12.1.1'
          method: 'network'
          # Windows requires exact versioned component names. VS integration is mandatory for C++ on Windows.
          sub-packages: '["nvcc_12.1", "visual_studio_integration_12.1"]'

      - uses: pypa/cibuildwheel@v2.16
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-*"
          # Use single quotes for the main string to safely include double quotes for the install command
          CIBW_BEFORE_BUILD: >
            pip install ".[jax]" --extra-index-url https://download.pytorch.org/whl/cu121 &&
            python -c "import eiko.eiko_torch; import eiko.eiko_jax"
          # Dynamically inject the CUDA path from the toolkit action
          CIBW_ENVIRONMENT: |
            PATH=$PATH:"${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin"
            CUDA_HOME="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
            TORCH_CUDA_ARCH_LIST="7.5;8.0;8.6;8.9;9.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

  build-wheels-linux:
      runs-on: ubuntu-latest
      steps:
        # OPTIONAL BUT RECOMMENDED: Free up disk space. 
        # CUDA Toolkit + PyTorch + 4 Python versions = very high risk of running out of disk space on standard GitHub runners.
        - name: Free Disk Space (Ubuntu)
          uses: jlumbroso/free-disk-space@main
          with:
            tool-cache: false
            android: true
            dotnet: true
            haskell: true
            large-packages: false
            docker-images: true
            swap-storage: false
  
        - uses: actions/checkout@v4
        
        - uses: pypa/cibuildwheel@v2.16
          env:
            CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
            CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-*"
            
            # Install ONLY the compiler and headers into the manylinux container instead of the whole toolkit
            CIBW_BEFORE_ALL: |
              dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
              dnf install -y cuda-nvcc-12-1 cuda-cudart-devel-12-1
            
            # We pass PIP_EXTRA_INDEX_URL to the environment so the isolated 
            # build-system can find PyTorch when reading pyproject.toml
            CIBW_ENVIRONMENT: >
              LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
              CUDA_HOME=/usr/local/cuda
              TORCH_CUDA_ARCH_LIST="7.5;8.0;8.6;8.9;9.0"
              PIP_EXTRA_INDEX_URL="https://download.pytorch.org/whl/cu121"
  
        - uses: actions/upload-artifact@v4
          with:
            name: wheels-linux
            path: ./wheelhouse/*.whl

# Build MATLAB Toolbox on Windows (Generates .mexw64)
  build-matlab-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.18
        with: {cuda: '12.1.1', method: 'network'}
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2021b'
          products: 'Parallel_Computing_Toolbox'
      - name: Build MATLAB Toolbox and MEX
        uses: matlab-actions/run-command@v2
        env:
        # Match the path to the version installed by Jimver/cuda-toolkit
          CUDA_HOME: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.1'
        with:
          # Assumes build_release() calls 'mex' which utilizes the system's VS compiler
          command: addpath(genpath('${{ github.workspace }}')); build_release();
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-toolbox-windows
          path: releases/*.mltbx

  # Build MATLAB Toolbox on Linux (Generates .mexa64)
  build-matlab-linux:
    runs-on: ubuntu-22.04
    # Use a container to target Ubuntu 20.04 (which will work for later versions due to forward compatibility, since we statically compile to glibc).
    container: 
      image: nvidia/cuda:12.1.1-devel-ubuntu20.04
    steps:
      - name: Install Prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git curl zip unzip software-properties-common python3-pip
      - uses: actions/checkout@v4
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Release should be R2020b or above.
          release: 'R2021b'
          products: 'Parallel_Computing_Toolbox'
      - name: Build MATLAB Toolbox
        uses: matlab-actions/run-command@v2
        env:
          CUDA_HOME: '/usr/local/cuda'
        with:
          command: addpath(genpath('${{ github.workspace }}')); build_release();
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-toolbox-linux
          path: releases/*.mltbx

  merge-and-release:
    needs: [build-wheels-windows, build-wheels-linux, build-matlab-linux, build-matlab-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All
        uses: actions/download-artifact@v4
        with: {path: raw-downloads}
      - name: Merge and Repackage
        run: |
          mkdir -p unified-toolbox/extracted_win unified-toolbox/extracted_lin unified-toolbox/merged/+eiko_lib
          WIN_MLTBX=$(find raw-downloads -name "*.mltbx" | grep "windows" | head -n 1)
          unzip -q "$WIN_MLTBX" -d unified-toolbox/extracted_win
          LIN_MLTBX=$(find raw-downloads -name "*.mltbx" | grep "linux" | head -n 1)
          unzip -q "$LIN_MLTBX" -d unified-toolbox/extracted_lin
          cp -r unified-toolbox/extracted_win/* unified-toolbox/merged/
          cp unified-toolbox/extracted_lin/fs/matlab/eiko/+eiko_lib/*.mexa64 unified-toolbox/merged/fs/matlab/eiko/+eiko_lib/ 2>/dev/null || true
          mkdir -p final-release
          cd unified-toolbox/merged && zip -q -r ../../final-release/Eiko-Universal.mltbx * && cd ../..
          find raw-downloads -name "*.whl" -exec cp {} final-release/ \;
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
