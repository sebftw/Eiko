name: Package Eiko Multi-Language Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-wheels-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.6.0'
            torch_tag: 'cu126'
          - cuda: '13.0.0'
            torch_tag: 'cu130'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set SDK Environment Variable
        run: echo "DISTUTILS_USE_SDK=1" >> $env:GITHUB_ENV
      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with: 
          cuda: ${{ matrix.cuda }}
          method: 'network'
          cache: 'true'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev"]'
       
      - name: Set Global CUDA Environment Variables
        run: |
          $cudaPath = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "CUDA_HOME=$cudaPath" >> $env:GITHUB_ENV
          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          echo "$($cudaPath)\bin" >> $env:GITHUB_PATH
       
      - name: Debug Environment
        shell: powershell
        run: |
          Get-ChildItem Env: | Where-Object {$_.Name -like "*CUDA*"}
          Write-Host "CUDA_HOME is: $env:CUDA_HOME"
      
      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          
          CIBW_BEFORE_BUILD: >
            pip install ninja setuptools>=61.0.0 wheel "torch>=2.0.0" jax pybind11 --extra-index-url https://download.pytorch.org/whl/${{ matrix.torch_tag }}
            
          CIBW_ENVIRONMENT: >
            CUDA_HOME="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
            CUDA_PATH="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
            TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0+PTX"
            IS_RELEASE_BUILD=1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-cuda${{ matrix.cuda }}
          path: ./wheelhouse/*.whl

  build-wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.6.0'
            torch_tag: 'cu126'
            dnf_repo: 'rhel8'          # CUDA 12 supports RHEL 8
            manylinux_img: 'quay.io/pypa/manylinux_2_28_x86_64:latest'
            dnf_tag: '12-6'
          - cuda: '13.0.0'
            torch_tag: 'cu130'
            dnf_repo: 'rhel9'          # CUDA 13 requires RHEL 9 / glibc 2.34+
            manylinux_img: 'quay.io/pypa/manylinux_2_34_x86_64:latest'
            dnf_tag: '13-0'
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
  
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      # Updated to a modern cibuildwheel version
      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_img }}
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation --no-cache-dir"
          
          CIBW_BEFORE_BUILD: >
            pip install setuptools>=61.0.0 wheel &&
            pip install --no-cache-dir torch>=2.0.0 --index-url https://download.pytorch.org/whl/${{ matrix.torch_tag }} &&
            pip install jax pybind11
            
          CIBW_BEFORE_ALL: |
            PKG_MGR=$(command -v dnf || command -v yum)
            if [ -z "$PKG_MGR" ]; then echo "Neither yum nor dnf found!"; exit 1; fi
            $PKG_MGR config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.dnf_repo }}/x86_64/cuda-${{ matrix.dnf_repo }}.repo
            
            # Install python3 if not already present
            $PKG_MGR install -y python3 python3-pip python3-devel
            
            # Install CUDA
            $PKG_MGR config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.dnf_repo }}/x86_64/cuda-${{ matrix.dnf_repo }}.repo
            $PKG_MGR install -y cuda-nvcc-${{ matrix.dnf_tag }} cuda-cudart-devel-${{ matrix.dnf_tag }} cuda-libraries-devel-${{ matrix.dnf_tag }}
          
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_python.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}
            
          # CRITICAL: Ensures the isolated compilation container inherits these paths
          CIBW_ENVIRONMENT_PASS_LINUX: CUDA_HOME PATH LD_LIBRARY_PATH TORCH_CUDA_ARCH_LIST FORCE_CUDA PIP_EXTRA_INDEX_URL IS_RELEASE_BUILD
            
          CIBW_ENVIRONMENT: >
            CUDA_HOME=/usr/local/cuda
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0+PTX"
            FORCE_CUDA=1
            PIP_EXTRA_INDEX_URL="https://download.pytorch.org/whl/${{ matrix.torch_tag }}"
            IS_RELEASE_BUILD=1
  
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cuda${{ matrix.cuda }}
          path: ./wheelhouse/*.whl

  merge-and-release:
    needs: [build-wheels-windows, build-wheels-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-downloads
          
      - name: Gather Release Files
        run: |
          mkdir -p final-release
          find raw-downloads -name "*.whl" -exec cp {} final-release/ \;
          find raw-downloads -name "*.mexw64" -exec cp {} final-release/ \;
          find raw-downloads -name "*.mexa64" -exec cp {} final-release/ \;

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}