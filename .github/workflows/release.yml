name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mltbx:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.18
        with: {cuda: '12.1.1', method: 'network'}
      - name: Build MATLAB Toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: build_release()
      - name: Upload MLTBX
        uses: actions/upload-artifact@v4
        with:
          name: mltbx-${{ matrix.os }}
          path: releases/*.mltbx

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.18
        with: {cuda: '12.1.1', method: 'network'}
      
      - name: Build Wheels
        uses: pypa/cibuildwheel@v2.16
        env:
          # Install dependencies and trigger both JIT imports to build binaries
          CIBW_BEFORE_BUILD: |
            pip install torch>=2.0.0 "jax[cuda12]" pybind11
            python -c "import eiko.eiko_torch; import eiko.eiko_jax"
          # Ensure we build for your supported Python versions
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-*"
          # Ensure CUDA is accessible to the build process
          CIBW_ENVIRONMENT: 'PATH=$PATH:/usr/local/cuda/bin LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/cuda/lib64'
      
      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  merge-and-release:
    needs: [build-mltbx, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download All
        uses: actions/download-artifact@v4
        with: {path: raw-downloads}
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: raw-downloads/**/*
