name: Package Eiko Multi-Language Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_ubuntu_wheels:
    name: Ubuntu (Torch:${{ matrix.config.torch }}, CUDA:${{ matrix.config.cuda }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # PyTorch 2.5 supports older CUDA 12.x
          # - { torch: '2.5.0', cuda: '12.1.1' }
          # - { torch: '2.5.0', cuda: '12.4.0' }
          
          # PyTorch 2.9 dropped 12.4, moved to 12.6+
          - { torch: '2.9.0', cuda: '12.6.2' } 
          
          # PyTorch 2.12 supports 12.6 and 13.x
          # - { torch: '2.12.0', cuda: '12.6.2' }
          # - { torch: '2.12.0', cuda: '13.0.1' }
        
    container:
      # Hardcode ubuntu22.04 for all CUDA versions
      image: nvidia/cuda:${{ matrix.config.cuda }}-devel-ubuntu22.04

    steps:
      - name: Maximize Runner Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      
      - name: Pre-install Git for Checkout
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      - name: Install System Dependencies and Python via Deadsnakes
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y software-properties-common build-essential git wget curl
          
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          
          # Install target Python versions at once
          apt-get install -y python3.11 python3.11-dev python3.11-venv python3.11-distutils
          apt-get install -y python3.12 python3.12-dev python3.12-venv

          # Bootstrap pip globally for both versions
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          python3.11 get-pip.py
          python3.12 get-pip.py

      - name: Format CUDA version for PyTorch
        id: format-cuda
        run: |
          CUDA_SHORT=$(echo ${{ matrix.config.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV
      
      - name: Compile Wheels for all Python Versions
        env:
          FORCE_CUDA: "1" # <-- PYTORCH SHOULD COMPILE WITHOUT RUNTIME GPU CHECK
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_ROOT_USER_ACTION: "ignore"
          EIKO_RELEASE_BUILD: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          # Compile for each supported Python version.
          for PY in "python3.11" "python3.12"; do
            echo "Building for $PY..."
            
            $PY -m pip install --upgrade pip setuptools wheel ninja build
            
            # 1. Install PyTorch from the explicit wheel index, along with JAX (+pybind11)
            $PY -m pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
            $PY -m pip install jax pybind11
            
            # 2. Build the wheel 
            $PY -m build --wheel --no-isolation
            
            rm -rf build/ *.egg-info/

            # 4. CLEANUP: Reclaim ~5-7GB before moving to the next Python version
            echo "Cleaning up $PY dependencies to save disk space..."
            $PY -m pip uninstall -y torch torchvision jax pybind11
            $PY -m pip cache purge 2>/dev/null || true
          done
      
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-pt${{ matrix.config.torch }}-${{ env.cu_version }}
          path: dist/*.whl

  build_windows_wheels:
    name: Windows (Torch:${{ matrix.config.torch }}, CUDA:${{ matrix.config.cuda }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # PyTorch 2.5 supports older CUDA 12.x
          # - { torch: '2.5.0', cuda: '12.1.1' }
          # - { torch: '2.5.0', cuda: '12.4.0' }
          
          # PyTorch 2.9 dropped 12.4, moved to 12.6+
          # - { torch: '2.9.0', cuda: '12.6.2' } 
          
          # PyTorch 2.12 supports 12.6 and 13.x
          # - { torch: '2.12.0', cuda: '12.6.2' }
          - { torch: '2.12.0', cuda: '13.0.1' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.config.cuda }}
          method: 'network'
          use-github-cache: 'true'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev"]'
          
      - name: Format CUDA version for PyTorch
        shell: bash
        id: format-cuda
        run: |
          CUDA_SHORT=$(echo ${{ matrix.config.cuda }} | cut -d'.' -f1,2 | tr -d '.')
          echo "cu_version=cu$CUDA_SHORT" >> $GITHUB_ENV
      
      - name: Set CUDA_HOME
        run: |
          echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $env:GITHUB_ENV
          echo "CUDA_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $env:GITHUB_ENV 

      - name: Verify CUDA_HOME
        run: |
          echo "The CUDA_HOME variable is currently set to: $env:CUDA_HOME"
          echo "Testing if nvcc is accessible:"
          nvcc --version
      
      # --- PYTHON 3.11 BUILD ---
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build 3.11 Wheel
        env:
          DISTUTILS_USE_SDK: "1"  # Crucial: Tells setuptools to use the active MSVC env
          FORCE_CUDA: "1"        # Forces compilation even if runtime check fails (there is no GPU attached)
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_NO_CACHE_DIR: "1"
          CUDA_HOME: ${{ env.CUDA_PATH }} # Force PyTorch to see the toolkit path
          EIKO_RELEASE_BUILD: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja build
          
          # 1. Install PyTorch and JAX (+pybind11)
          pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax pybind11
          
          # 2. Build Wheel
          python -m build --wheel --no-isolation
          
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force

      # --- PYTHON 3.12 BUILD ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Build 3.12 Wheel
        env:
          DISTUTILS_USE_SDK: "1"  # Crucial: Tells setuptools to use the active MSVC env
          FORCE_CUDA: "1"        # Forces compilation even if runtime check fails (there is no GPU attached)
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX" 
          MAX_JOBS: 2
          EIKO_LOCAL_VERSION: "+pt${{ matrix.config.torch }}${{ env.cu_version }}"
          PIP_NO_CACHE_DIR: "1"
          CUDA_HOME: ${{ env.CUDA_PATH }} # Force PyTorch to see the toolkit path 
          EIKO_RELEASE_BUILD: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja build
          
          # 1. Install PyTorch and JAX (+pybind11)
          pip install torch==${{ matrix.config.torch }} torchvision --index-url https://download.pytorch.org/whl/${{ env.cu_version }}
          pip install jax pybind11
          
          # 3. Build Wheel
          python -m build --wheel --no-isolation
          
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          Get-ChildItem -Filter "*.egg-info" -Directory | Remove-Item -Recurse -Force
      
      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-pt${{ matrix.config.torch }}-${{ env.cu_version }}
          path: dist/*.whl
          
  publish_gh_pages:
    name: Generate Siloed HTML Indexes and Publish
    needs: [build_ubuntu_wheels, build_windows_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages branch to preserve history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
        continue-on-error: true # Fails gracefully if this is the first ever release

      - name: Create fallback directory
        run: mkdir -p public

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true

      - name: Generate PEP-503 compliant Siloed Indexes
        run: |
          mkdir -p public/whl
          
          # 1. Sort NEW wheels into the existing PEP-503 structure
          for wheel in wheelhouse/*.whl; do
            filename=$(basename "$wheel")
            
            if [[ "$filename" =~ (cu[0-9]+) ]]; then
              cuda_tag="${BASH_REMATCH[1]}"
            else
              cuda_tag="cpu"
            fi
            
            mkdir -p "public/whl/$cuda_tag/eiko"
            cp "$wheel" "public/whl/$cuda_tag/eiko/"
          done

          # 2. Regenerate index files for ALL wheels (old + new)
          cd public/whl
          for dir in cu*; do
            if [ -d "$dir" ]; then
              echo "<!DOCTYPE html><html><body><a href=\"eiko/\">eiko</a></body></html>" > "$dir/index.html"
              
              cd "$dir/eiko"
              echo "<!DOCTYPE html><html><head><title>Links for eiko ($dir)</title></head><body>" > index.html
              echo "<h1>Links for eiko</h1>" >> index.html
              
              for w in *.whl; do
                if [ "$w" != "index.html" ]; then
                  echo "<a href=\"$w\">$w</a><br>" >> index.html
                fi
              done
              
              echo "</body></html>" >> index.html
              cd ../..
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
