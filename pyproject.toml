[build-system]
requires = ["setuptools>=61.0.0", "wheel", "build>=1.2.0", "validate-pyproject>=0.25"]
build-backend = "setuptools.build_meta"

[project]
name = "eiko"
dynamic = ["version", "license"]  # Grab version and license from setup.py
description = "Eiko: the GPU-accelerated Eikonal equation solver"
readme = "README.md"
requires-python = ">=3.8"  # Required for PyTorch 2.4.0
authors = [
    {name = "Sebastian Kazmarek Præsius", email = "sebastian.devel@gmail.com"},
]
keywords = [
    "gpu", "cuda", "pytorch", "jax", "automatic differentiation", "autodiff", 
    "time of flight", "beamforming", "shortest path", 
    "batch-processing", "fast iterative Method", "eikonal", "eikonal equation",
    "PDE", "partial differential equations", "scientific computing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics"
]

[project.optional-dependencies]
# Allow additional dependencies to be installed with, e.g., "pip install eiko[jax]".
# Dependencies required for JAX.
jax = [
    "jax[cuda12]>=0.4.13",       # Installs the GPU-enabled JAX backend via pip.
	"pybind11"
]
jax-local = [
    "jax[cuda12-local]>=0.4.13",  # This is only for HPC users ("modules load cuda/12.0").
    "pybind11"
]
torch = ["torch>=2.4.0", "ninja"] # While this extras exists, using "pip install eiko[torch]" will only install a CPU-only version of PyTorch, unfortunately.
# Dependencies require to run examples.
examples = [
	"torch>=2.4.0",
	"ninja",
    "matplotlib>=3.5.0", 
    "scipy>=1.7.0",
    "numpy>=1.21.0",
    "scikit-image",
    "pyvista>=0.43.0",
    "Pillow>=9.0.0"
]
# Dependencies required to run tests.
test = [
    "pytest>=7.0.0",
    "pytest-cov",  # Code coverage report.
    "tox>=4.0.0",
    "vermin",
    "jax[cuda12]>=0.4.13",
    "pybind11",
    "torch>=2.4.0",
	"ninja"
]

[project.urls]
Homepage = "https://github.com/sebftw/Eiko"


[tool.setuptools]
packages = ["eiko"]
include-package-data = true  # <-- Crucial for JIT compilation architectures

[tool.setuptools.package-dir]
"eiko" = "python/eiko"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
omit = [
    # Catches the file when tested inside the tox virtual environments
    "*/eiko/animate_eikonal.py",
    # Catches the file if we ever run pytest locally outside of tox
    "python/eiko/animate_eikonal.py"
]

[tool.coverage.paths]
# Maps the tox installed package paths back to local source code 
# so coverage reports show the correct local file paths.
source = [
    "python/eiko",
    "*/site-packages/eiko",
    "*\\site-packages\\eiko"
]

[tool.coverage.report]
show_missing = true
# You can also add other helpful report settings here:
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]
