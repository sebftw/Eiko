[tox]
# Define the matrix of Python versions you support.
envlist = py38, py39, py310, py311, coverage
# Required for modern pyproject.toml (PEP 517) builds
isolated_build = True

[testenv]
description = Run Eiko test suite
deps =
    pytest
    pytest-cov
# Explicitly pass through compiler and CUDA environment variables 
# so pybind11 and setuptools can compile the C++/.cu extensions
passenv =
    CUDA_HOME
    CUDA_PATH
    PATH
    CPATH
    LD_LIBRARY_PATH
    TORCH_CUDA_ARCH_LIST
# Install the [test] group from pyproject.toml
extras = test
# 1. Force pytest to measure the installed package, not the local folder
# 2. --cov-append ensures parallel/sequential runs don't overwrite each other
commands =
    # {posargs} allows extra additional arguments to be passed to pytest from the CLI
    pytest --cov={envsitepackagesdir}/eiko --cov-config=pyproject.toml --cov-append {posargs}
install_command =
    pip install --extra-index-url https://download.pytorch.org/whl/cu121 {opts} {packages}

[testenv:coverage]
description = Combine coverage data and generate reports
# Add py310 as dependency to ensure this runs AFTER the other.
depends = py310
# This env doesn't need to install eiko or run tests again, just needs coverage tool
deps = coverage[toml]
skip_install = true
commands =
    coverage report
    coverage xml
    coverage html